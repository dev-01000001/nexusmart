server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        regex: nexus_ecom
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: (.+)
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        regex: (.+)
        target_label: compose_project
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      - json:
          expressions:
            level: level
            trace_id: trace_id
            span_id: span_id
            span_trace_id: span.trace_id
            span_span_id: span.span_id
            msg: msg
            message: message
            json_service: service
      - template:
          source: level
          template: "{{ ToLower .Value }}"
      - template:
          source: trace_id
          template: "{{ if .Value }}{{ .Value }}{{ else }}{{ .span_trace_id }}{{ end }}"
      - template:
          source: span_id
          template: "{{ if .Value }}{{ .Value }}{{ else }}{{ .span_span_id }}{{ end }}"
      - labels:
          level:
      - structured_metadata:
          trace_id:
          span_id:
