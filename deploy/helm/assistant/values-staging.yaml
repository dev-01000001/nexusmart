# Staging overrides for assistant (namespace: nexusmart-staging)
replicaCount: 1

image:
  tag: "staging"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

pdb:
  enabled: false

config:
  LLM_MODE: "mock"
  EMBED_MODE: "mock"
