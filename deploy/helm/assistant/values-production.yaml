# Production overrides for assistant (namespace: nexusmart-production)
replicaCount: 2

image:
  tag: "0.1.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 800m
    memory: 512Mi

pdb:
  enabled: true
  minAvailable: 1

config:
  LLM_MODE: "mock"
  EMBED_MODE: "mock"
