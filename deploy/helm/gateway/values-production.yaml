# Production overrides for gateway (namespace: nexusmart-production)
replicaCount: 2

image:
  tag: "0.1.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: "api.nexusmart.vn"
      paths:
        - path: "/"
          pathType: Prefix
  tls:
    - secretName: nexusmart-gateway-tls
      hosts:
        - "api.nexusmart.vn"

config:
  SITE_ROOT_DOMAIN: "nexusmart.vn"
  RATE_LIMIT_IP_PER_MIN: "600"
  RATE_LIMIT_USER_PER_MIN: "300"
  RATE_LIMIT_FLASH_SALE_PER_MIN: "120"
  LOG_LEVEL: "info"
