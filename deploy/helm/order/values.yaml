replicaCount: 1
revisionHistoryLimit: 5
terminationGracePeriodSeconds: 30

image:
  repository: ghcr.io/nexusmart/order
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

strategy:
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

service:
  type: ClusterIP
  httpPort: 8085
  grpcPort: 50055

metrics:
  enabled: true
  path: "/metrics"

probes:
  readiness:
    path: "/readyz"
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  liveness:
    path: "/healthz"
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180

pdb:
  enabled: false
  minAvailable: 1

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

# Non-secret configuration rendered into ConfigMap (separated from image).
config:
  SERVICE_NAME: "order"
  HTTP_PORT: "8085"
  GRPC_PORT: "50055"
  NATS_URL: "nats://nats:4222"
  NATS_STREAM: "NEXUSMART"
  USER_GRPC_ADDR: "user:50051"
  PRODUCT_GRPC_ADDR: "product:50052"
  CART_GRPC_ADDR: "cart:50053"
  PROMOTION_GRPC_ADDR: "promotion:50054"
  PAYMENT_GRPC_ADDR: "payment:50056"
  SHIPPING_GRPC_ADDR: "shipping:50057"
  ORDER_COD_MAX_REJECTED_COUNT: "3"
  ORDER_COD_REQUIRE_PHONE_VERIFIED: "true"
  ORDER_COD_MIN_ORDERS_FOR_RATE: "3"
  ORDER_COD_MAX_REJECT_RATE_BPS: "3000"
  ORDER_FLASH_PAYMENT_EXPIRY_MINUTES: "5"
  ORDER_AUTO_COMPLETE_DAYS: "7"
  ORDER_SELLER_CONFIRM_HOURS: "48"
  ORDER_RETURN_SELLER_RESPONSE_DAYS: "3"
  ORDER_RETURN_SHIP_DAYS: "5"
  ORDER_RETURN_INSPECT_DAYS: "3"
  ORDER_BATCH_SHIP_MAX_ITEMS: "50"
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  LOG_LEVEL: "info"

# Runtime secrets injected via pre-created Kubernetes Secret (never committed in Git).
secrets:
  existingSecret: "nexusmart-order-secret"
  optional: false

extraEnv: []
nodeSelector: {}
tolerations: []
affinity: {}
