# Production overrides for payment (namespace: nexusmart-production)
replicaCount: 2

image:
  tag: "0.1.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 150m
    memory: 192Mi
  limits:
    cpu: 800m
    memory: 512Mi

pdb:
  enabled: true
  minAvailable: 1

config:
  VIETQR_MODE: "sandbox"
  RUST_LOG: "info"
