# Staging overrides for payment (namespace: nexusmart-staging)
replicaCount: 1

image:
  tag: "staging"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

pdb:
  enabled: false

config:
  VIETQR_MODE: "mock"
  RUST_LOG: "info"
