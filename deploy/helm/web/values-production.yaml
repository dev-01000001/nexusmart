# Production overrides for web (namespace: nexusmart-production)
replicaCount: 2

image:
  tag: "0.1.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

pdb:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: "nexusmart.vn"
      paths:
        - path: "/"
          pathType: Prefix
    - host: "*.nexusmart.vn"
      paths:
        - path: "/"
          pathType: Prefix
  tls:
    - secretName: nexusmart-web-tls
      hosts:
        - "nexusmart.vn"
        - "*.nexusmart.vn"

config:
  COOKIE_SECURE: "true"
  # ingress-nginx overwrites X-Forwarded-For by default when use-forwarded-headers=false.
  TRUST_PROXY_HEADERS: "true"
  APP_ORIGIN: "https://nexusmart.vn"
  SITE_ROOT_DOMAIN: "nexusmart.vn"
  PUBLIC_GATEWAY_URL: "https://api.nexusmart.vn"
  CHAT_WS_URL: "wss://api.nexusmart.vn/api/v1/chat/ws"
