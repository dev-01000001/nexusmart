replicaCount: 1
revisionHistoryLimit: 5
terminationGracePeriodSeconds: 30

image:
  repository: ghcr.io/nexusmart/cart
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

strategy:
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

service:
  type: ClusterIP
  httpPort: 8083
  grpcPort: 50053

metrics:
  enabled: true
  path: "/metrics"

probes:
  readiness:
    path: "/readyz"
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  liveness:
    path: "/healthz"
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180

pdb:
  enabled: false
  minAvailable: 1

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

# Non-secret configuration rendered into ConfigMap (separated from image).
config:
  SERVICE_NAME: "cart"
  HTTP_PORT: "8083"
  GRPC_PORT: "50053"
  REDIS_ADDR: "redis:6379"
  PRODUCT_GRPC_ADDR: "product:50052"
  USER_GRPC_ADDR: "user:50051"
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  LOG_LEVEL: "info"

# Runtime secrets injected via pre-created Kubernetes Secret (never committed in Git).
secrets:
  existingSecret: "nexusmart-cart-secret"
  optional: false

extraEnv: []
nodeSelector: {}
tolerations: []
affinity: {}
