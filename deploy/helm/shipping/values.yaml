replicaCount: 1
revisionHistoryLimit: 5
terminationGracePeriodSeconds: 30

image:
  repository: ghcr.io/nexusmart/shipping
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

strategy:
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

service:
  type: ClusterIP
  httpPort: 8087
  grpcPort: 50057

metrics:
  enabled: true
  path: "/metrics"

probes:
  readiness:
    path: "/readyz"
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  liveness:
    path: "/healthz"
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180

pdb:
  enabled: false
  minAvailable: 1

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

# Non-secret configuration rendered into ConfigMap (separated from image).
config:
  SERVICE_NAME: "shipping"
  HTTP_PORT: "8087"
  GRPC_PORT: "50057"
  REDIS_ADDR: "redis:6379"
  USER_GRPC_ADDR: "user:50051"
  NATS_URL: "nats://nats:4222"
  NATS_STREAM: "NEXUSMART"
  NATS_DLQ_STREAM: "NEXUSMART_DLQ"
  SHIPPING_MAX_REDELIVERY: "3"
  SHIPPING_FEE_CACHE_TTL_SECONDS: "60"
  SHIPPING_CREATE_RETRY_MAX: "8"
  SHIPPING_CREATE_RETRY_BASE_MS: "2000"
  SHIPPING_CREATE_RETRY_MAX_BACKOFF_MS: "300000"
  SHIPPING_CREATE_WORKER_INTERVAL_MS: "2000"
  CARRIER_MAX_RETRIES: "3"
  CARRIER_CB_MAX_FAILURES: "3"
  CARRIER_CB_OPEN_TIMEOUT: "30s"
  SHIPPING_LABEL_BASE_URL: "https://nexusmart.local/api/shipping/labels"
  GHN_MODE: "mock"
  GHN_BASE_URL: "https://dev-online-gateway.ghn.vn/shiip/public-api"
  GHN_SHOP_ID: "0"
  GHTK_MODE: "mock"
  GHTK_BASE_URL: "https://services-staging.ghtklab.com"
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  LOG_LEVEL: "info"

# Runtime secrets injected via pre-created Kubernetes Secret (never committed in Git).
secrets:
  existingSecret: "nexusmart-shipping-secret"
  optional: false

extraEnv: []
nodeSelector: {}
tolerations: []
affinity: {}
