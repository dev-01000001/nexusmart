# Production overrides for shipping (namespace: nexusmart-production)
replicaCount: 2

image:
  tag: "0.1.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

pdb:
  enabled: true
  minAvailable: 1

config:
  GHN_MODE: "sandbox"
  MOCK_CARRIER_ENABLED: "true"
