    depends_on:
      redis:
        condition: service_healthy
      product:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/healthz || exit 1"]
