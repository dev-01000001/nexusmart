services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusmart_dev_password}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./infra/postgres/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexusmart} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 15

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_PROM_PORT:-8889}:8889"

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    environment:
      SERVICE_NAME: user
      GRPC_PORT: "50051"
      HTTP_PORT: "8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexusmart}:${POSTGRES_PASSWORD:-nexusmart_dev_password}@postgres:5432/user_db?sslmode=disable
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-NEXUSMART}
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-only-nexusmart-service-hs256-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@nexusmart.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-AdminDevPassword123!}
      SHIPPING_GRPC_ADDR: shipping:50057
      SITE_ROOT_DOMAIN: ${SITE_ROOT_DOMAIN:-nexusmart.localhost}
      CF_MODE: ${CF_MODE:-mock}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      CF_ORIGIN_HOST: ${CF_ORIGIN_HOST:-origin.nexusmart.localhost}
      CF_CNAME_TARGET: ${CF_CNAME_TARGET:-shops.nexusmart.localhost}
      CF_POLL_INTERVAL: ${CF_POLL_INTERVAL:-5s}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${USER_HTTP_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  product:
    build:
      context: .
      dockerfile: services/product/Dockerfile
    environment:
      SERVICE_NAME: product
      GRPC_PORT: "50052"
      HTTP_PORT: "8082"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexusmart}:${POSTGRES_PASSWORD:-nexusmart_dev_password}@postgres:5432/product_db?sslmode=disable
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-NEXUSMART}
      FLASH_SALE_SWEEP_INTERVAL: ${FLASH_SALE_SWEEP_INTERVAL:-2s}
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-only-nexusmart-service-hs256-secret-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${PRODUCT_HTTP_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  cart:
    build:
      context: .
      dockerfile: services/cart/Dockerfile
    environment:
      SERVICE_NAME: cart
      GRPC_PORT: "50053"
      HTTP_PORT: "8083"
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      PRODUCT_GRPC_ADDR: product:50052
      USER_GRPC_ADDR: user:50051
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-only-nexusmart-service-hs256-secret-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${CART_HTTP_PORT:-8083}:8083"
    depends_on:
      redis:
        condition: service_healthy
      product:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  promotion:
    build:
      context: .
      dockerfile: services/promotion/Dockerfile
    environment:
      SERVICE_NAME: promotion
      GRPC_PORT: "50054"
      HTTP_PORT: "8084"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexusmart}:${POSTGRES_PASSWORD:-nexusmart_dev_password}@postgres:5432/promotion_db?sslmode=disable
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-NEXUSMART}
      PRODUCT_GRPC_ADDR: product:50052
      FLASH_SALE_SWEEP_INTERVAL: ${FLASH_SALE_SWEEP_INTERVAL:-2s}
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-only-nexusmart-service-hs256-secret-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${PROMOTION_HTTP_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      product:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  payment:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    environment:
      SERVICE_NAME: payment
      GRPC_PORT: "50056"
      HTTP_PORT: "8086"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexusmart}:${POSTGRES_PASSWORD:-nexusmart_dev_password}@postgres:5432/payment_db?sslmode=disable
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-NEXUSMART}
      VIETQR_MODE: ${VIETQR_MODE:-mock}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-only-payment-webhook-hmac-secret}
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-only-nexusmart-service-hs256-secret-change-me}
      PAYMENT_EXPIRY_MINUTES: ${PAYMENT_EXPIRY_MINUTES:-15}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-sandbox-client-id}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-sandbox-api-key}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-sandbox-checksum-key}
      SEPAY_API_TOKEN: ${SEPAY_API_TOKEN:-sandbox-sepay-token}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${PAYMENT_HTTP_PORT:-8086}:8086"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/healthz || curl -fsS http://127.0.0.1:8086/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  shipping:
    build:
      context: .
      dockerfile: services/shipping/Dockerfile
    environment:
      SERVICE_NAME: shipping
      GRPC_PORT: "50057"
      HTTP_PORT: "8087"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexusmart}:${POSTGRES_PASSWORD:-nexusmart_dev_password}@postgres:5432/shipping_db?sslmode=disable
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-NEXUSMART}
      SHIPPING_WEBHOOK_SECRET: ${SHIPPING_WEBHOOK_SECRET:-dev-only-shipping-webhook-hmac-secret}
      GHN_ENABLED: ${GHN_ENABLED:-true}
      GHN_MODE: ${GHN_MODE:-mock}
      GHN_BASE_URL: ${GHN_BASE_URL:-https://dev-online-gateway.ghn.vn/shiip/public-api}
      GHN_TOKEN: ${GHN_TOKEN:-sandbox-ghn-token}
      GHN_SHOP_ID: ${GHN_SHOP_ID:-0}
      MOCK_CARRIER_ENABLED: ${MOCK_CARRIER_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-only-nexusmart-service-hs256-secret-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${SHIPPING_HTTP_PORT:-8087}:8087"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8087/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      SERVICE_NAME: notification
      GRPC_PORT: "50058"
      HTTP_PORT: "8088"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexusmart}:${POSTGRES_PASSWORD:-nexusmart_dev_password}@postgres:5432/notification_db?sslmode=disable
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-NEXUSMART}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@nexusmart.local}
      USER_GRPC_ADDR: user:50051
      SITE_URL_SCHEME: ${SITE_URL_SCHEME:-https}
      SITE_URL_PORT: ${SITE_URL_PORT:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-only-nexusmart-service-hs256-secret-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${NOTIFICATION_HTTP_PORT:-8088}:8088"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8088/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  order:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    environment:
      SERVICE_NAME: order
      GRPC_PORT: "50055"
      HTTP_PORT: "8085"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexusmart}:${POSTGRES_PASSWORD:-nexusmart_dev_password}@postgres:5432/order_db?sslmode=disable
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-NEXUSMART}
      USER_GRPC_ADDR: user:50051
      PRODUCT_GRPC_ADDR: product:50052
      CART_GRPC_ADDR: cart:50053
      PROMOTION_GRPC_ADDR: promotion:50054
      PAYMENT_GRPC_ADDR: payment:50056
      SHIPPING_GRPC_ADDR: shipping:50057
      ORDER_COD_MAX_VND: ${ORDER_COD_MAX_VND:-5000000}
      ORDER_COD_MAX_REJECTED_COUNT: ${ORDER_COD_MAX_REJECTED_COUNT:-3}
      ORDER_PAYMENT_EXPIRY_MINUTES: ${ORDER_PAYMENT_EXPIRY_MINUTES:-15}
      ORDER_DEFAULT_COMMISSION_BPS: ${ORDER_DEFAULT_COMMISSION_BPS:-500}
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-only-nexusmart-service-hs256-secret-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${ORDER_HTTP_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      user:
        condition: service_healthy
      product:
        condition: service_healthy
      cart:
        condition: service_healthy
      promotion:
        condition: service_healthy
      payment:
        condition: service_healthy
      shipping:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  search-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusmart_dev_password}
      POSTGRES_DB: search_db
    ports:
      - "127.0.0.1:${SEARCH_POSTGRES_PORT:-5433}:5432"
    volumes:
      - search_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexusmart} -d search_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-only-meilisearch-master-key-change-me}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health || curl -fsS http://127.0.0.1:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  search:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    environment:
      SERVICE_NAME: search
      GRPC_PORT: "50059"
      HTTP_PORT: "8089"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexusmart}:${POSTGRES_PASSWORD:-nexusmart_dev_password}@search-postgres:5432/search_db?sslmode=disable
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-only-meilisearch-master-key-change-me}
      MEILI_INDEX: ${MEILI_INDEX:-products}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-NEXUSMART}
      PRODUCT_GRPC_ADDR: product:50052
      EMBED_MODE: ${EMBED_MODE:-mock}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-3-lite}
      SEARCH_STARTUP_SYNC: ${SEARCH_STARTUP_SYNC:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-only-nexusmart-service-hs256-secret-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${SEARCH_HTTP_PORT:-8089}:8089"
    depends_on:
      search-postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      nats:
        condition: service_healthy
      product:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8089/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  assistant:
    build:
      context: .
      dockerfile: services/assistant/Dockerfile
    environment:
      SERVICE_NAME: assistant
      GRPC_PORT: "50061"
      HTTP_PORT: "8091"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexusmart}:${POSTGRES_PASSWORD:-nexusmart_dev_password}@postgres:5432/assistant_db?sslmode=disable
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-NEXUSMART}
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      GATEWAY_URL: http://gateway:8080
      SEARCH_GRPC_ADDR: search:50059
      PRODUCT_GRPC_ADDR: product:50052
      CHAT_GRPC_ADDR: chat:50060
      LLM_MODE: ${LLM_MODE:-mock}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      EMBED_MODE: ${EMBED_MODE:-mock}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      ASSISTANT_DAILY_USER_TOKEN_LIMIT: ${ASSISTANT_DAILY_USER_TOKEN_LIMIT:-50000}
      ASSISTANT_DAILY_COST_LIMIT_VND: ${ASSISTANT_DAILY_COST_LIMIT_VND:-500000}
      ASSISTANT_CACHE_TTL: ${ASSISTANT_CACHE_TTL:-10m}
      ASSISTANT_REVIEW_SUMMARY_TTL: ${ASSISTANT_REVIEW_SUMMARY_TTL:-1h}
      ASSISTANT_MIN_REVIEWS_SUMMARY: ${ASSISTANT_MIN_REVIEWS_SUMMARY:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${ASSISTANT_HTTP_PORT:-8091}:8091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    environment:
      SERVICE_NAME: chat
      GRPC_PORT: "50060"
      HTTP_PORT: "8090"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexusmart}:${POSTGRES_PASSWORD:-nexusmart_dev_password}@postgres:5432/chat_db?sslmode=disable
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      USER_GRPC_ADDR: user:50051
      SITE_ROOT_DOMAIN: ${SITE_ROOT_DOMAIN:-nexusmart.localhost}
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-only-nexusmart-service-hs256-secret-change-me}
      CHAT_WS_TICKET_TTL: ${CHAT_WS_TICKET_TTL:-60s}
      CHAT_WS_ALLOWED_ORIGINS: ${CHAT_WS_ALLOWED_ORIGINS:-}
      CHAT_IMAGE_MAX_BYTES: ${CHAT_IMAGE_MAX_BYTES:-5242880}
      CHAT_IMAGE_VALIDATE_MODE: ${CHAT_IMAGE_VALIDATE_MODE:-hybrid}
      CHAT_IMAGE_ALLOWED_HOSTS: ${CHAT_IMAGE_ALLOWED_HOSTS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${CHAT_HTTP_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      SERVICE_NAME: gateway
      HTTP_PORT: "8080"
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      RATE_LIMIT_IP_PER_MIN: ${RATE_LIMIT_IP_PER_MIN:-300}
      RATE_LIMIT_USER_PER_MIN: ${RATE_LIMIT_USER_PER_MIN:-180}
      RATE_LIMIT_FLASH_SALE_PER_MIN: ${RATE_LIMIT_FLASH_SALE_PER_MIN:-60}
      # Only trust proxy headers arriving over the dedicated internal BFF network (web -> gateway-bff),
      # so host/external callers on 28080 and other compose containers cannot spoof X-Forwarded-For.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.31.250.0/28}
      SITE_ROOT_DOMAIN: ${SITE_ROOT_DOMAIN:-nexusmart.localhost}
      USER_GRPC_ADDR: user:50051
      PRODUCT_GRPC_ADDR: product:50052
      CART_GRPC_ADDR: cart:50053
      PROMOTION_GRPC_ADDR: promotion:50054
      ORDER_GRPC_ADDR: order:50055
      PAYMENT_GRPC_ADDR: payment:50056
      PAYMENT_HTTP_URL: http://payment:8086
      SHIPPING_GRPC_ADDR: shipping:50057
      SHIPPING_HTTP_URL: http://shipping:8087
      NOTIFICATION_GRPC_ADDR: notification:50058
      ASSISTANT_GRPC_ADDR: assistant:50061
      ASSISTANT_HTTP_URL: http://assistant:8091
      SEARCH_GRPC_ADDR: search:50059
      CHAT_GRPC_ADDR: chat:50060
      CHAT_HTTP_URL: http://chat:8090
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      default:
      bff:
        aliases:
          - gateway-bff
    depends_on:
      redis:
        condition: service_healthy
      user:
        condition: service_healthy
      product:
        condition: service_healthy
      cart:
        condition: service_healthy
      promotion:
        condition: service_healthy
      order:
        condition: service_healthy
      payment:
        condition: service_healthy
      shipping:
        condition: service_healthy
      notification:
        condition: service_healthy
      search:
        condition: service_healthy
      chat:
        condition: service_healthy
      assistant:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Next.js storefront / seller center / admin (BFF). Talks to the gateway over the internal `bff`
  # network (`gateway-bff`) so gateway trusts forwarded client IPs only from `web`.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      GATEWAY_URL: http://gateway-bff:8080
      GATEWAY_TIMEOUT_MS: ${GATEWAY_TIMEOUT_MS:-8000}
      COOKIE_SECURE: ${WEB_COOKIE_SECURE:-false}
      APP_ORIGIN: ${WEB_APP_ORIGIN:-}
      SITE_ROOT_DOMAIN: ${SITE_ROOT_DOMAIN:-nexusmart.localhost}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${WEB_PORT:-3300}:3000"
    networks:
      - default
      - bff
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 10

  # E2E suite (profile "e2e", started by `make e2e`). Runs inside the compose network because
  # service gRPC ports are deliberately not published to the host.
  e2e:
    image: golang:1.22-alpine
    profiles: ["e2e"]
    working_dir: /src/tests/e2e
    volumes:
      - .:/src
      - ${GOMODCACHE:-~/go/pkg/mod}:/go/pkg/mod
    environment:
      CGO_ENABLED: "0"
      HOME: /tmp
      GOCACHE: /tmp/go-build
      GATEWAY_URL: http://gateway:8080
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      USER_HTTP_URL: http://user:8081
      PRODUCT_HTTP_URL: http://product:8082
      CART_HTTP_URL: http://cart:8083
      PROMOTION_HTTP_URL: http://promotion:8084
      ORDER_HTTP_URL: http://order:8085
      PAYMENT_HTTP_URL: http://payment:8086
      SHIPPING_HTTP_URL: http://shipping:8087
      NOTIFICATION_HTTP_URL: http://notification:8088
      USER_GRPC_ADDR: user:50051
      PRODUCT_GRPC_ADDR: product:50052
      CART_GRPC_ADDR: cart:50053
      PROMOTION_GRPC_ADDR: promotion:50054
      ORDER_GRPC_ADDR: order:50055
      PAYMENT_GRPC_ADDR: payment:50056
      SHIPPING_GRPC_ADDR: shipping:50057
      NOTIFICATION_GRPC_ADDR: notification:50058
      ASSISTANT_GRPC_ADDR: assistant:50061
      ASSISTANT_HTTP_URL: http://assistant:8091
      SEARCH_GRPC_ADDR: search:50059
      CHAT_GRPC_ADDR: chat:50060
      CHAT_HTTP_URL: http://chat:8090
      MAILPIT_URL: http://mailpit:8025
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@nexusmart.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-AdminDevPassword123!}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-only-payment-webhook-hmac-secret}
      SHIPPING_WEBHOOK_SECRET: ${SHIPPING_WEBHOOK_SECRET:-dev-only-shipping-webhook-hmac-secret}
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      SITE_ROOT_DOMAIN: ${SITE_ROOT_DOMAIN:-nexusmart.localhost}
    command: ["go", "test", "-v", "-count=1", "-timeout", "5m", "./..."]

  # Web E2E suite through the BFF (profile "e2e-web", started by `make e2e-web`, which brings
  # `web` up with --no-deps first so running backend containers are never recreated).
  e2e-web:
    image: node:22-alpine
    profiles: ["e2e-web"]
    working_dir: /src
    volumes:
      - ./tests/e2e-web:/src:ro
    environment:
      WEB_URL: http://web:3000
      WEB_ORIGIN: ${E2E_WEB_ORIGIN:-}
      SITE_ROOT_DOMAIN: ${SITE_ROOT_DOMAIN:-nexusmart.localhost}
      MAILPIT_URL: http://mailpit:8025
      GATEWAY_URL: http://gateway:8080
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-only-payment-webhook-hmac-secret}
    command: ["node", "--test", "--test-concurrency=1", "--test-reporter=spec"]

  # --- Observability & AIOps stack (Swarm E, profile "obs" so default stack stays lean) ---
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["obs"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["obs"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./deploy/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    depends_on:
      telegram-relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  telegram-relay:
    build:
      context: ./deploy/observability/telegram-relay
      dockerfile: Dockerfile
    profiles: ["obs"]
    environment:
      PORT: "8099"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "127.0.0.1:${TELEGRAM_RELAY_PORT:-8099}:8099"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8099/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  loki:
    image: grafana/loki:3.1.1
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./deploy/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  promtail:
    image: grafana/promtail:3.1.1
    profiles: ["obs"]
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./deploy/observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["obs"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: ["obs"]
    command:
      - "--housekeeping_interval=10s"
      - "--docker_only=true"
      - "--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-nexusmart_obs_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-red-overview.json
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3400}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  aiops:
    build:
      context: .
      dockerfile: services/aiops/Dockerfile
    profiles: ["obs"]
    environment:
      SERVICE_NAME: aiops
      HTTP_PORT: "8092"
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      NATS_MONITOR_URL: http://nats:8222/healthz
      TELEGRAM_WEBHOOK_URL: http://telegram-relay:8099/webhook
      AIOPS_POLL_INTERVAL_SECS: ${AIOPS_POLL_INTERVAL_SECS:-10}
      AIOPS_DRY_RUN: ${AIOPS_DRY_RUN:-true}
      AIOPS_AUTO_REMEDIATE: ${AIOPS_AUTO_REMEDIATE:-false}
      AIOPS_ADAPTER: ${AIOPS_ADAPTER:-docker}
      AIOPS_MAX_ACTIONS_PER_HOUR: ${AIOPS_MAX_ACTIONS_PER_HOUR:-3}
      AIOPS_ZSCORE_THRESHOLD: ${AIOPS_ZSCORE_THRESHOLD:-3.0}
      AIOPS_EWMA_ALPHA: ${AIOPS_EWMA_ALPHA:-0.3}
      LLM_MODE: ${LLM_MODE:-mock}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_DAILY_MAX_CALLS: ${LLM_DAILY_MAX_CALLS:-100}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-5.0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${AIOPS_HTTP_PORT:-8092}:8092"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      telegram-relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8092/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15

networks:
  default:
  bff:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/28

volumes:
  postgres_data:
  redis_data:
  nats_data:
  search_postgres_data:
  meilisearch_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
