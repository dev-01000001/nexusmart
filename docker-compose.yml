# All published ports except gateway and web bind to 127.0.0.1 only; use an SSH tunnel for remote access.
services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusmart_dev_password}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./infra/postgres/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Probe via TCP (-h 127.0.0.1) so the Unix-socket-only initdb server on a fresh volume is not reported healthy before port 5432 listens.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-nexusmart} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Dedicated pgvector Postgres for search_db (G13): keeps shared postgres on postgres:16-alpine to avoid musl/glibc collation corruption; pinned >= 0.8 for hnsw.iterative_scan.
  search-postgres:
    image: pgvector/pgvector:0.8.7-pg16
    mem_limit: 384m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusmart_dev_password}
      POSTGRES_DB: search_db
    volumes:
      - search_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-nexusmart} -d search_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Meilisearch Community pinned per ADR-0004/G13; internal compose network only (no host port published).
  meilisearch:
    image: getmeili/meilisearch:v1.58.0
    mem_limit: 512m
    environment:
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-only-meilisearch-master-key-change-me}
      MEILI_NO_ANALYTICS: ${MEILI_NO_ANALYTICS:-true}
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-256Mb}
    volumes:
      # Separate from phase-0b v1.12 volume (meilisearch_data): Meilisearch rejects cross-minor DB upgrades; rebuild index via POST /api/v1/admin/search/reindex.
      - meilisearch_v1_58_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health || curl -fsS http://127.0.0.1:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 15

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_PROM_PORT:-8889}:8889"
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
    # Scratch image has no shell/wget/curl; validate verifies config in-container while the
    # health_check extension exposes HTTP liveness on :13133 for host/network probes.
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otel-collector-config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    environment:
      SERVICE_NAME: user
      GRPC_PORT: "50051"
      HTTP_PORT: "8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexusmart}:${POSTGRES_PASSWORD:-nexusmart_dev_password}@postgres:5432/user_db?sslmode=disable
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-NEXUSMART}
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-only-nexusmart-service-hs256-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@nexusmart.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-AdminDevPassword123!}
      USER_BANK_PAYOUT_LOCK_HOURS: ${USER_BANK_PAYOUT_LOCK_HOURS:-24}
      USER_PHONE_OTP_TTL_SECONDS: ${USER_PHONE_OTP_TTL_SECONDS:-300}
      USER_PHONE_OTP_COOLDOWN_SECONDS: ${USER_PHONE_OTP_COOLDOWN_SECONDS:-60}
      USER_PHONE_OTP_MAX_PER_HOUR: ${USER_PHONE_OTP_MAX_PER_HOUR:-5}
      # Dev-only 32-byte base64 key for encrypting shop bank account numbers; replace in production.
      BANK_ACCOUNT_KEY: ${BANK_ACCOUNT_KEY:-ZGV2LW9ubHktYmFuay1hY2NvdW50LWtleS0zMmJ5dGU=}
      SHIPPING_GRPC_ADDR: shipping:50057
      SITE_ROOT_DOMAIN: ${SITE_ROOT_DOMAIN:-nexusmart.localhost}
      CF_MODE: ${CF_MODE:-mock}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      CF_ORIGIN_HOST: ${CF_ORIGIN_HOST:-origin.nexusmart.localhost}
      CF_CNAME_TARGET: ${CF_CNAME_TARGET:-shops.nexusmart.localhost}
      CF_POLL_INTERVAL: ${CF_POLL_INTERVAL:-5s}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${USER_HTTP_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  product:
    build:
      context: .
      dockerfile: services/product/Dockerfile
    environment:
      SERVICE_NAME: product
      GRPC_PORT: "50052"
      HTTP_PORT: "8082"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexusmart}:${POSTGRES_PASSWORD:-nexusmart_dev_password}@postgres:5432/product_db?sslmode=disable
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-NEXUSMART}
      # Lazy gRPC dial targets for review verification/display (E5/E6); never add order/user to product.depends_on (avoids cycle).
      ORDER_GRPC_ADDR: order:50055
      USER_GRPC_ADDR: user:50051
      PRODUCT_IMPORT_MAX_ROWS: ${PRODUCT_IMPORT_MAX_ROWS:-1000}
      PRODUCT_IMPORT_MAX_BYTES: ${PRODUCT_IMPORT_MAX_BYTES:-1048576}
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-only-nexusmart-service-hs256-secret-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${PRODUCT_HTTP_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  cart:
    build:
      context: .
      dockerfile: services/cart/Dockerfile
    environment:
      SERVICE_NAME: cart
      GRPC_PORT: "50053"
      HTTP_PORT: "8083"
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      PRODUCT_GRPC_ADDR: product:50052
      USER_GRPC_ADDR: user:50051
      JWT_SECRET: ${JWT_SECRET:-dev-only-nexusmart-hs256-secret-change-me}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-only-nexusmart-service-hs256-secret-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
