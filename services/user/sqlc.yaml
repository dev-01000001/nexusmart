version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        rename:
          before_json: "BeforeJSON"
          after_json: "AfterJSON"
          ip_address: "IPAddress"
          avatar_url: "AvatarURL"
          cod_rejected_count: "CODRejectedCount"
          otp_hash: "OTPHash"
          otp_expires_at: "OTPExpiresAt"
          otp_attempts: "OTPAttempts"
          otp_publish_failed: "OTPPublishFailed"
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "uuid"
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "string"
              pointer: true
