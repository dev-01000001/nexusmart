extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: nexusmart-services
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets:
                - gateway:8080
                - user:8081
                - product:8082
                - cart:8083
                - promotion:8084
                - order:8085
                - payment:8086
                - shipping:8087
                - notification:8088
                - search:8089
                - chat:8090
                - assistant:8091
                - aiops:8092

processors:
  batch:
    timeout: 2s
    send_batch_size: 256

exporters:
  debug:
    verbosity: basic
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [prometheus, debug]
