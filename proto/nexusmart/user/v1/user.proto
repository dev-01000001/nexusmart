syntax = "proto3";

package nexusmart.user.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nexusmart/core/gen/go/nexusmart/user/v1;userv1";

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_BUYER = 1;
  USER_ROLE_SELLER = 2;
  USER_ROLE_ADMIN = 3;
  USER_ROLE_SUPER_ADMIN = 4;
  USER_ROLE_MODERATOR = 5;
  USER_ROLE_CSKH = 6;
  USER_ROLE_ACCOUNTANT = 7;
  USER_ROLE_OPS = 8;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_PENDING_VERIFICATION = 1;
  USER_STATUS_ACTIVE = 2;
  USER_STATUS_LOCKED = 3;
}

enum ShopStatus {
  SHOP_STATUS_UNSPECIFIED = 0;
  SHOP_STATUS_PENDING = 1;
  SHOP_STATUS_ACTIVE = 2;
  SHOP_STATUS_REJECTED = 3;
  SHOP_STATUS_SUSPENDED = 4;
}

enum ReviewDecision {
  REVIEW_DECISION_UNSPECIFIED = 0;
  REVIEW_DECISION_APPROVE = 1;
  REVIEW_DECISION_REJECT = 2;
  REVIEW_DECISION_REQUEST_INFO = 3;
}

enum ShopBankAccountStatus {
  SHOP_BANK_ACCOUNT_STATUS_UNSPECIFIED = 0;
  SHOP_BANK_ACCOUNT_STATUS_PENDING_OTP = 1;
  SHOP_BANK_ACCOUNT_STATUS_PENDING_ADMIN_REVIEW = 2;
  SHOP_BANK_ACCOUNT_STATUS_VERIFIED = 3;
  SHOP_BANK_ACCOUNT_STATUS_REJECTED = 4;
}

enum ShopApprovalStatus {
  SHOP_APPROVAL_STATUS_UNSPECIFIED = 0;
  SHOP_APPROVAL_STATUS_PENDING = 1;
  SHOP_APPROVAL_STATUS_APPROVED = 2;
  SHOP_APPROVAL_STATUS_REJECTED = 3;
}

enum SiteStatus {
  SITE_STATUS_UNSPECIFIED = 0;
  SITE_STATUS_DRAFT = 1;
  SITE_STATUS_PUBLISHED = 2;
  SITE_STATUS_SUSPENDED = 3;
}

message User {
  string id = 1;
  string full_name = 2;
  string email = 3;
  string phone = 4;
  UserRole role = 5;
  UserStatus status = 6;
  string shop_id = 7;
  bool phone_verified = 8;
  int32 cod_rejected_count = 9;
  string avatar_url = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  string lock_reason = 13;
}

message Shop {
  string id = 1;
  string owner_user_id = 2;
  string name = 3;
  string description = 4;
  string pickup_address_id = 5;
  string contact_phone = 6;
  string business_license_doc = 7;
  ShopStatus status = 8;
  string rejection_reason = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  string slug = 12;
  // Populated only for admin callers; always false on public and seller responses.
  bool bank_review_pending = 13;
  // Suspension metadata populated when status == SHOP_STATUS_SUSPENDED (F12).
  string suspended_reason = 14;
  google.protobuf.Timestamp suspended_at = 15;
  // Monotonic status transition version carried on user.shop_status_changed events (F12).
  int64 status_version = 16;
}

message Address {
  string id = 1;
  string user_id = 2;
  string recipient_name = 3;
  string recipient_phone = 4;
  string province_code = 5;
  string province_name = 6;
  string ward_code = 7;
  string ward_name = 8;
  string street_address = 9;
  string legacy_province_code = 10;
  string legacy_district_code = 11;
  string legacy_ward_code = 12;
  bool is_default = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message AuditLog {
  string id = 1;
  string actor_id = 2;
  string actor_role = 3;
  string action = 4;
  string target_type = 5;
  string target_id = 6;
  string before_json = 7;
  string after_json = 8;
  string reason = 9;
  string ip_address = 10;
  google.protobuf.Timestamp created_at = 11;
}

message RegisterRequest {
  string full_name = 1;
  string email = 2;
  string phone = 3;
  string password = 4;
}

message RegisterResponse {
  string user_id = 1;
  string email = 2;
  string status = 3;
}

message VerifyOTPRequest {
  string email = 1;
  string otp = 2;
}

message VerifyOTPResponse {
  bool verified = 1;
  User user = 2;
}

message ResendOTPRequest {
  string email = 1;
}

message ResendOTPResponse {
  bool sent = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in_seconds = 3;
  User user = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in_seconds = 3;
}

message LogoutRequest {
  string refresh_token = 1;
  string user_id = 2;
}

message LogoutResponse {
  bool ok = 1;
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  User user = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  string full_name = 2;
  string phone = 3;
  string avatar_url = 4;
}

message UpdateProfileResponse {
  User user = 1;
}

message ValidateUserRequest {
  string user_id = 1;
}

message ValidateUserResponse {
  bool valid = 1;
  UserRole role = 2;
  UserStatus status = 3;
  string shop_id = 4;
  bool phone_verified = 5;
  int32 cod_rejected_count = 6;
}

message AdminListUsersRequest {
  string query = 1;
  UserRole role = 2;
  UserStatus status = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message AdminListUsersResponse {
  repeated User users = 1;
  int64 total = 2;
}

message AdminUpdateUserStatusRequest {
  string admin_id = 1;
  string target_user_id = 2;
  UserStatus status = 3;
  string reason = 4;
}

message AdminUpdateUserStatusResponse {
  User user = 1;
}

message AdminUpdateUserRoleRequest {
  string admin_id = 1;
  string target_user_id = 2;
  UserRole role = 3;
  string reason = 4;
}

message AdminUpdateUserRoleResponse {
  User user = 1;
}

message RegisterShopRequest {
  string user_id = 1;
  string name = 2;
  string description = 3;
  string pickup_address_id = 4;
  string contact_phone = 5;
  string business_license_doc = 6;
  string slug = 7;
}

message RegisterShopResponse {
  Shop shop = 1;
}

message GetShopRequest {
  string shop_id = 1;
  string owner_user_id = 2;
  string slug = 3;
}

message GetShopResponse {
  Shop shop = 1;
}

message GetShopInternalRequest {
  string shop_id = 1;
  string owner_user_id = 2;
  string slug = 3;
}

message GetShopInternalResponse {
  Shop shop = 1;
}

message ListPublicShopsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListPublicShopsResponse {
  repeated Shop shops = 1;
  int64 total = 2;
}

message AdminListShopsRequest {
  ShopStatus status = 1;
  int32 page = 2;
  int32 page_size = 3;
  bool bank_review_pending_only = 4;
}

message AdminListShopsResponse {
  repeated Shop shops = 1;
  int64 total = 2;
}

message AdminReviewShopRequest {
  string admin_id = 1;
  string shop_id = 2;
  ReviewDecision decision = 3;
  string reason = 4;
  // Optional snapshot of owner full_name observed by admin; if set and different from current full_name on APPROVE, returns FailedPrecondition (OWNER_NAME_CHANGED) (D6).
  string expected_owner_name = 5;
}

message AdminReviewShopResponse {
  Shop shop = 1;
}

message CreateAddressRequest {
  string user_id = 1;
  string recipient_name = 2;
  string recipient_phone = 3;
  string province_code = 4;
  string province_name = 5;
  string ward_code = 6;
  string ward_name = 7;
  string street_address = 8;
  string legacy_province = 9;
  string legacy_district = 10;
  string legacy_ward = 11;
  bool is_default = 12;
}

message CreateAddressResponse {
  Address address = 1;
}

message ListAddressesRequest {
  string user_id = 1;
}

message ListAddressesResponse {
  repeated Address addresses = 1;
}

message GetAddressRequest {
  string user_id = 1;
  string address_id = 2;
}

message GetAddressResponse {
  Address address = 1;
}

message UpdateAddressRequest {
  string user_id = 1;
  string address_id = 2;
  string recipient_name = 3;
  string recipient_phone = 4;
  string province_code = 5;
  string province_name = 6;
  string ward_code = 7;
  string ward_name = 8;
  string street_address = 9;
  bool is_default = 10;
}

message UpdateAddressResponse {
  Address address = 1;
}

message DeleteAddressRequest {
  string user_id = 1;
  string address_id = 2;
}

message DeleteAddressResponse {
  bool ok = 1;
}

message WriteAuditLogRequest {
  string actor_id = 1;
  string actor_role = 2;
  string action = 3;
  string target_type = 4;
  string target_id = 5;
  string before_json = 6;
  string after_json = 7;
  string reason = 8;
  string ip_address = 9;
}

message WriteAuditLogResponse {
  AuditLog audit_log = 1;
}

message ListAuditLogsRequest {
  string actor_id = 1;
  string target_type = 2;
  string target_id = 3;
  google.protobuf.Timestamp from_time = 4;
  google.protobuf.Timestamp to_time = 5;
  int32 page = 6;
  int32 page_size = 7;
}

message ListAuditLogsResponse {
  repeated AuditLog logs = 1;
  int64 total = 2;
}

// Records a buyer's COD delivery rejection; idempotent per order_id.
message RecordCODRejectionRequest {
  string user_id = 1;
  string order_id = 2;
  string reason = 3;
}

message RecordCODRejectionResponse {
  int32 cod_rejected_count = 1;
  bool already_recorded = 2;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  bool sent = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {
  bool ok = 1;
}

message ShopBankAccount {
  string id = 1;
  string shop_id = 2;
  string bank_code = 3;
  string bank_name = 4;
  string account_number_masked = 5;
  // Populated ONLY by internal service-token GetShopBankAccountForPayout; always empty for all end-user callers (including sellers and admins).
  string account_number = 6;
  string account_holder_name = 7;
  bool holder_name_matched = 8;
  ShopBankAccountStatus status = 9;
  string review_note = 10;
  // Set to now + 24h whenever a shop changes its verified bank account (anti-takeover payout lock).
  google.protobuf.Timestamp payout_locked_until = 11;
  google.protobuf.Timestamp verified_at = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message AddShopBankAccountRequest {
  // Optional for seller (always overridden by verified JWT shop_id).
  string shop_id = 1;
  string bank_code = 2;
  string bank_name = 3;
  string account_number = 4;
  string account_holder_name = 5;
}

message AddShopBankAccountResponse {
  ShopBankAccount bank_account = 1;
  bool otp_sent = 2;
}

message VerifyShopBankAccountOTPRequest {
  // Optional for seller (always overridden by verified JWT shop_id).
  string shop_id = 1;
  string otp = 2;
}

message VerifyShopBankAccountOTPResponse {
  ShopBankAccount bank_account = 1;
}

message GetShopBankAccountRequest {
  // Optional for seller (always overridden by verified JWT shop_id); required for admin.
  string shop_id = 1;
}

message GetShopBankAccountResponse {
  ShopBankAccount bank_account = 1;
}

message AdminReviewShopBankAccountRequest {
  string shop_id = 1;
  // Required (D6): ID of the specific PENDING_ADMIN_REVIEW bank account row reviewed by admin (empty -> InvalidArgument; row no longer pending -> FailedPrecondition).
  string bank_account_id = 2;
  // Valid values: REVIEW_DECISION_APPROVE or REVIEW_DECISION_REJECT.
  ReviewDecision decision = 3;
  string reason = 4;
}

message AdminReviewShopBankAccountResponse {
  ShopBankAccount bank_account = 1;
}

message DailyUserShopStat {
  // Vietnam date in YYYY-MM-DD (Asia/Ho_Chi_Minh).
  string date = 1;
  int64 new_users = 2;
  int64 new_shops = 3;
}

message GetPlatformUserStatsRequest {
  // Vietnam dates YYYY-MM-DD inclusive (max span 366 days).
  string from_date = 1;
  string to_date = 2;
}

message GetPlatformUserStatsResponse {
  string from_date = 1;
  string to_date = 2;
  int64 total_users = 3;
  int64 active_users = 4;
  int64 new_users = 5;
  int64 total_shops = 6;
  int64 active_shops = 7;
  int64 pending_shops = 8;
  int64 new_shops = 9;
  repeated DailyUserShopStat daily = 10;
}

message GetShopBankAccountForPayoutRequest {
  string shop_id = 1;
}

message GetShopBankAccountForPayoutResponse {
  ShopBankAccount bank_account = 1;
}

message RequestPhoneOTPRequest {
  string phone = 1;
}

message RequestPhoneOTPResponse {
  bool sent = 1;
  int32 expires_in_seconds = 2;
  int32 retry_after_seconds = 3;
  string phone_masked = 4;
}

message VerifyPhoneOTPRequest {
  string phone = 1;
  string otp = 2;
}

message VerifyPhoneOTPResponse {
  bool verified = 1;
  User user = 2;
}

// Creates an internal staff user without accepting any plaintext password (F10/F14).
// The server creates the account with an unusable random credential and emits a password-reset email.
message AdminCreateStaffUserRequest {
  string full_name = 1;
  string email = 2;
  string phone = 3;
  // Allowed values: USER_ROLE_ADMIN, USER_ROLE_MODERATOR, USER_ROLE_CSKH, USER_ROLE_ACCOUNTANT, USER_ROLE_OPS.
  UserRole role = 4;
}

message AdminCreateStaffUserResponse {
  User user = 1;
  bool password_reset_sent = 2;
}

message UserActivityEntry {
  string id = 1;
  string user_id = 2;
  string event_type = 3;
  // Partially masked IP address (F13).
  string ip_address = 4;
  // Non-sensitive JSON metadata (never contains passwords, OTPs, or tokens) (F13).
  string metadata_json = 5;
  google.protobuf.Timestamp created_at = 6;
}

message AdminListUserActivitiesRequest {
  string user_id = 1;
  google.protobuf.Timestamp from_time = 2;
  google.protobuf.Timestamp to_time = 3;
  string category = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message AdminListUserActivitiesResponse {
  repeated UserActivityEntry items = 1;
  int64 total = 2;
  int32 cod_rejected_count = 3;
}

message ShopSuspensionApproval {
  string id = 1;
  string shop_id = 2;
  string shop_name = 3;
  ShopApprovalStatus status = 4;
  string reason = 5;
  string requested_by = 6;
  string requested_role = 7;
  string decided_by = 8;
  string decided_note = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp decided_at = 11;
}

message AdminRequestShopSuspensionRequest {
  string shop_id = 1;
  string reason = 2;
}

message AdminRequestShopSuspensionResponse {
  ShopSuspensionApproval approval = 1;
}

message AdminListShopApprovalsRequest {
  ShopApprovalStatus status = 1;
  string shop_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message AdminListShopApprovalsResponse {
  repeated ShopSuspensionApproval items = 1;
  int64 total = 2;
}

message AdminDecideShopSuspensionRequest {
  string approval_id = 1;
  // Valid values: REVIEW_DECISION_APPROVE or REVIEW_DECISION_REJECT.
  ReviewDecision decision = 2;
  string note = 3;
}

message AdminDecideShopSuspensionResponse {
  ShopSuspensionApproval approval = 1;
  Shop shop = 2;
}

message AdminUnsuspendShopRequest {
  string shop_id = 1;
  string reason = 2;
}

message AdminUnsuspendShopResponse {
  Shop shop = 1;
}

message PublicShop {
  string id = 1;
  string name = 2;
  string description = 3;
  ShopStatus status = 4;
}

message Site {
  string id = 1;
  string shop_id = 2;
  string shop_name = 3;
  string subdomain = 4;
  string primary_host = 5;
  SiteStatus status = 6;
  string config_json = 7;
  string published_version_id = 8;
  int32 published_version_number = 9;
  google.protobuf.Timestamp published_at = 10;
  string suspended_reason = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message SiteVersion {
  string id = 1;
  string site_id = 2;
  int32 version_number = 3;
  string config_json = 4;
  string published_by = 5;
  string note = 6;
  google.protobuf.Timestamp created_at = 7;
}

message GetSiteByHostRequest {
  string host = 1;
}

message GetSiteByHostResponse {
  Site site = 1;
  PublicShop shop = 2;
}

message GetSiteByShopRequest {
  string shop_id = 1;
}

message GetSiteByShopResponse {
  Site site = 1;
  PublicShop shop = 2;
}

message GetSiteDraftRequest {
  string shop_id = 1;
}

message GetSiteDraftResponse {
  Site site = 1;
}

message SaveSiteDraftRequest {
  string shop_id = 1;
  string subdomain = 2;
  string config_json = 3;
}

message SaveSiteDraftResponse {
  Site site = 1;
}

message PublishSiteRequest {
  string shop_id = 1;
  string note = 2;
}

message PublishSiteResponse {
  Site site = 1;
  SiteVersion version = 2;
}

message RollbackSiteRequest {
  string shop_id = 1;
  string version_id = 2;
  string note = 3;
}

message RollbackSiteResponse {
  Site site = 1;
  SiteVersion version = 2;
}

message ListSiteVersionsRequest {
  string shop_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListSiteVersionsResponse {
  repeated SiteVersion versions = 1;
  int64 total = 2;
}

message ListSitesRequest {
  SiteStatus status = 1;
  string query = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListSitesResponse {
  repeated Site sites = 1;
  int64 total = 2;
}

message SuspendSiteRequest {
  string site_id = 1;
  bool suspend = 2;
  string reason = 3;
}

message SuspendSiteResponse {
  Site site = 1;
}

// PublishedSiteSummary is the public directory card of a PUBLISHED site whose shop is ACTIVE.
// Fields come only from the published config and public shop profile (never the draft).
message PublishedSiteSummary {
  string site_id = 1;
  string shop_id = 2;
  string shop_name = 3;
  string subdomain = 4;
  string primary_host = 5;
  string logo_url = 6;
  string cover_url = 7;
  string tagline = 8;
  google.protobuf.Timestamp published_at = 9;
}

// ListPublishedSitesRequest is public (no JWT). page_size defaults to 24, capped at 48.
message ListPublishedSitesRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListPublishedSitesResponse {
  repeated PublishedSiteSummary sites = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message DomainVerificationRecord {
  string type = 1;
  string name = 2;
  string value = 3;
}

message Domain {
  string id = 1;
  string host = 2;
  string kind = 3;
  string status = 4;
  bool is_primary = 5;
  repeated DomainVerificationRecord verification = 6;
  string last_error = 7;
  google.protobuf.Timestamp verified_at = 8;
  google.protobuf.Timestamp created_at = 9;
}

message AddCustomDomainRequest {
  string shop_id = 1;
  string hostname = 2;
}

message AddCustomDomainResponse {
  Domain domain = 1;
}

message CheckCustomDomainRequest {
  string shop_id = 1;
  string domain_id = 2;
}

message CheckCustomDomainResponse {
  Domain domain = 1;
}

message RemoveCustomDomainRequest {
  string shop_id = 1;
  string domain_id = 2;
}

message RemoveCustomDomainResponse {}

message ListSiteDomainsRequest {
  string shop_id = 1;
}

message ListSiteDomainsResponse {
  repeated Domain domains = 1;
}

message SiteTemplate {
  string id = 1;
  string slug = 2;
  string name = 3;
  string category = 4;
  string archetype = 5;
  string description = 6;
  string preview_image_url = 7;
  repeated string tags = 8;
  string config_json = 9;
  bool is_active = 10;
  int32 sort_order = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message ListSiteTemplatesRequest {}

message ListSiteTemplatesResponse {
  repeated SiteTemplate templates = 1;
}

message GetSiteTemplateRequest {
  string id = 1;
}

message GetSiteTemplateResponse {
  SiteTemplate template = 1;
}

message ApplySiteTemplateRequest {
  string shop_id = 1;
  string template_id = 2;
  string subdomain = 3;
}

message ApplySiteTemplateResponse {
  Site site = 1;
  SiteTemplate template = 2;
}

service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc VerifyOTP(VerifyOTPRequest) returns (VerifyOTPResponse);
  rpc ResendOTP(ResendOTPRequest) returns (ResendOTPResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ValidateUser(ValidateUserRequest) returns (ValidateUserResponse);
  rpc AdminListUsers(AdminListUsersRequest) returns (AdminListUsersResponse);
  rpc AdminUpdateUserStatus(AdminUpdateUserStatusRequest) returns (AdminUpdateUserStatusResponse);
  rpc AdminUpdateUserRole(AdminUpdateUserRoleRequest) returns (AdminUpdateUserRoleResponse);
  rpc RegisterShop(RegisterShopRequest) returns (RegisterShopResponse);
  rpc GetShop(GetShopRequest) returns (GetShopResponse);
  rpc GetShopInternal(GetShopInternalRequest) returns (GetShopInternalResponse);
  rpc ListPublicShops(ListPublicShopsRequest) returns (ListPublicShopsResponse);
  rpc AdminListShops(AdminListShopsRequest) returns (AdminListShopsResponse);
  rpc AdminReviewShop(AdminReviewShopRequest) returns (AdminReviewShopResponse);
  rpc CreateAddress(CreateAddressRequest) returns (CreateAddressResponse);
  rpc ListAddresses(ListAddressesRequest) returns (ListAddressesResponse);
  rpc GetAddress(GetAddressRequest) returns (GetAddressResponse);
  rpc UpdateAddress(UpdateAddressRequest) returns (UpdateAddressResponse);
  rpc DeleteAddress(DeleteAddressRequest) returns (DeleteAddressResponse);
  rpc WriteAuditLog(WriteAuditLogRequest) returns (WriteAuditLogResponse);
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);
  rpc RecordCODRejection(RecordCODRejectionRequest) returns (RecordCODRejectionResponse);
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc AddShopBankAccount(AddShopBankAccountRequest) returns (AddShopBankAccountResponse);
  rpc VerifyShopBankAccountOTP(VerifyShopBankAccountOTPRequest) returns (VerifyShopBankAccountOTPResponse);
  rpc GetShopBankAccount(GetShopBankAccountRequest) returns (GetShopBankAccountResponse);
  rpc AdminReviewShopBankAccount(AdminReviewShopBankAccountRequest) returns (AdminReviewShopBankAccountResponse);
  rpc GetPlatformUserStats(GetPlatformUserStatsRequest) returns (GetPlatformUserStatsResponse);
  rpc GetShopBankAccountForPayout(GetShopBankAccountForPayoutRequest) returns (GetShopBankAccountForPayoutResponse);
  rpc RequestPhoneOTP(RequestPhoneOTPRequest) returns (RequestPhoneOTPResponse);
  rpc VerifyPhoneOTP(VerifyPhoneOTPRequest) returns (VerifyPhoneOTPResponse);
  rpc AdminCreateStaffUser(AdminCreateStaffUserRequest) returns (AdminCreateStaffUserResponse);
  rpc AdminListUserActivities(AdminListUserActivitiesRequest) returns (AdminListUserActivitiesResponse);
  rpc AdminRequestShopSuspension(AdminRequestShopSuspensionRequest) returns (AdminRequestShopSuspensionResponse);
  rpc AdminListShopApprovals(AdminListShopApprovalsRequest) returns (AdminListShopApprovalsResponse);
  rpc AdminDecideShopSuspension(AdminDecideShopSuspensionRequest) returns (AdminDecideShopSuspensionResponse);
  rpc AdminUnsuspendShop(AdminUnsuspendShopRequest) returns (AdminUnsuspendShopResponse);
  rpc GetSiteByHost(GetSiteByHostRequest) returns (GetSiteByHostResponse);
  rpc GetSiteByShop(GetSiteByShopRequest) returns (GetSiteByShopResponse);
  rpc GetSiteDraft(GetSiteDraftRequest) returns (GetSiteDraftResponse);
  rpc SaveSiteDraft(SaveSiteDraftRequest) returns (SaveSiteDraftResponse);
  rpc PublishSite(PublishSiteRequest) returns (PublishSiteResponse);
  rpc RollbackSite(RollbackSiteRequest) returns (RollbackSiteResponse);
  rpc ListSiteVersions(ListSiteVersionsRequest) returns (ListSiteVersionsResponse);
  rpc ListSites(ListSitesRequest) returns (ListSitesResponse);
