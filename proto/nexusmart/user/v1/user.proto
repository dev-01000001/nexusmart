syntax = "proto3";

package nexusmart.user.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nexusmart/core/gen/go/nexusmart/user/v1;userv1";

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_BUYER = 1;
  USER_ROLE_SELLER = 2;
  USER_ROLE_ADMIN = 3;
  USER_ROLE_SUPER_ADMIN = 4;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_PENDING_VERIFICATION = 1;
  USER_STATUS_ACTIVE = 2;
  USER_STATUS_LOCKED = 3;
}

enum ShopStatus {
  SHOP_STATUS_UNSPECIFIED = 0;
  SHOP_STATUS_PENDING = 1;
  SHOP_STATUS_ACTIVE = 2;
  SHOP_STATUS_REJECTED = 3;
  SHOP_STATUS_SUSPENDED = 4;
}

enum ReviewDecision {
  REVIEW_DECISION_UNSPECIFIED = 0;
  REVIEW_DECISION_APPROVE = 1;
  REVIEW_DECISION_REJECT = 2;
  REVIEW_DECISION_REQUEST_INFO = 3;
}

enum ShopBankAccountStatus {
  SHOP_BANK_ACCOUNT_STATUS_UNSPECIFIED = 0;
  SHOP_BANK_ACCOUNT_STATUS_PENDING_OTP = 1;
  SHOP_BANK_ACCOUNT_STATUS_PENDING_ADMIN_REVIEW = 2;
  SHOP_BANK_ACCOUNT_STATUS_VERIFIED = 3;
  SHOP_BANK_ACCOUNT_STATUS_REJECTED = 4;
}

message User {
  string id = 1;
  string full_name = 2;
  string email = 3;
  string phone = 4;
  UserRole role = 5;
  UserStatus status = 6;
  string shop_id = 7;
  bool phone_verified = 8;
  int32 cod_rejected_count = 9;
  string avatar_url = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  string lock_reason = 13;
}

message Shop {
  string id = 1;
  string owner_user_id = 2;
  string name = 3;
  string description = 4;
  string pickup_address_id = 5;
  string contact_phone = 6;
  string business_license_doc = 7;
  ShopStatus status = 8;
  string rejection_reason = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  string slug = 12;
  // Populated only for admin callers; always false on public and seller responses.
  bool bank_review_pending = 13;
}

message Address {
  string id = 1;
  string user_id = 2;
  string recipient_name = 3;
  string recipient_phone = 4;
  string province_code = 5;
  string province_name = 6;
  string ward_code = 7;
  string ward_name = 8;
  string street_address = 9;
  string legacy_province_code = 10;
  string legacy_district_code = 11;
  string legacy_ward_code = 12;
  bool is_default = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message AuditLog {
  string id = 1;
  string actor_id = 2;
  string actor_role = 3;
  string action = 4;
  string target_type = 5;
  string target_id = 6;
  string before_json = 7;
  string after_json = 8;
  string reason = 9;
  string ip_address = 10;
  google.protobuf.Timestamp created_at = 11;
}

message RegisterRequest {
  string full_name = 1;
  string email = 2;
  string phone = 3;
  string password = 4;
}

message RegisterResponse {
  string user_id = 1;
  string email = 2;
  string status = 3;
}

message VerifyOTPRequest {
  string email = 1;
  string otp = 2;
}

message VerifyOTPResponse {
  bool verified = 1;
  User user = 2;
}

message ResendOTPRequest {
  string email = 1;
}

message ResendOTPResponse {
  bool sent = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in_seconds = 3;
  User user = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in_seconds = 3;
}

message LogoutRequest {
  string refresh_token = 1;
  string user_id = 2;
}

message LogoutResponse {
  bool ok = 1;
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  User user = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  string full_name = 2;
  string phone = 3;
  string avatar_url = 4;
}

message UpdateProfileResponse {
  User user = 1;
}

message ValidateUserRequest {
  string user_id = 1;
}

message ValidateUserResponse {
  bool valid = 1;
  UserRole role = 2;
  UserStatus status = 3;
  string shop_id = 4;
  bool phone_verified = 5;
  int32 cod_rejected_count = 6;
}

message AdminListUsersRequest {
  string query = 1;
  UserRole role = 2;
  UserStatus status = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message AdminListUsersResponse {
  repeated User users = 1;
  int64 total = 2;
}

message AdminUpdateUserStatusRequest {
  string admin_id = 1;
  string target_user_id = 2;
  UserStatus status = 3;
  string reason = 4;
}

message AdminUpdateUserStatusResponse {
  User user = 1;
}

message AdminUpdateUserRoleRequest {
  string admin_id = 1;
  string target_user_id = 2;
  UserRole role = 3;
  string reason = 4;
}

message AdminUpdateUserRoleResponse {
  User user = 1;
}

message RegisterShopRequest {
  string user_id = 1;
  string name = 2;
  string description = 3;
  string pickup_address_id = 4;
  string contact_phone = 5;
  string business_license_doc = 6;
  string slug = 7;
}

message RegisterShopResponse {
  Shop shop = 1;
}

message GetShopRequest {
  string shop_id = 1;
  string owner_user_id = 2;
  string slug = 3;
}

message GetShopResponse {
  Shop shop = 1;
}

message ListPublicShopsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListPublicShopsResponse {
  repeated Shop shops = 1;
  int64 total = 2;
}

message AdminListShopsRequest {
  ShopStatus status = 1;
  int32 page = 2;
  int32 page_size = 3;
  bool bank_review_pending_only = 4;
}

message AdminListShopsResponse {
  repeated Shop shops = 1;
  int64 total = 2;
}

message AdminReviewShopRequest {
  string admin_id = 1;
  string shop_id = 2;
  ReviewDecision decision = 3;
  string reason = 4;
}

message AdminReviewShopResponse {
  Shop shop = 1;
}

message CreateAddressRequest {
  string user_id = 1;
  string recipient_name = 2;
  string recipient_phone = 3;
  string province_code = 4;
  string province_name = 5;
  string ward_code = 6;
  string ward_name = 7;
  string street_address = 8;
  string legacy_province = 9;
  string legacy_district = 10;
  string legacy_ward = 11;
  bool is_default = 12;
}

message CreateAddressResponse {
  Address address = 1;
}

message ListAddressesRequest {
  string user_id = 1;
}

message ListAddressesResponse {
  repeated Address addresses = 1;
}

message GetAddressRequest {
  string user_id = 1;
  string address_id = 2;
}

message GetAddressResponse {
  Address address = 1;
}

message UpdateAddressRequest {
  string user_id = 1;
  string address_id = 2;
  string recipient_name = 3;
  string recipient_phone = 4;
  string province_code = 5;
  string province_name = 6;
  string ward_code = 7;
  string ward_name = 8;
  string street_address = 9;
  bool is_default = 10;
}

message UpdateAddressResponse {
  Address address = 1;
}

message DeleteAddressRequest {
  string user_id = 1;
  string address_id = 2;
}

message DeleteAddressResponse {
  bool ok = 1;
}

message WriteAuditLogRequest {
  string actor_id = 1;
  string actor_role = 2;
  string action = 3;
  string target_type = 4;
  string target_id = 5;
  string before_json = 6;
  string after_json = 7;
  string reason = 8;
  string ip_address = 9;
}

message WriteAuditLogResponse {
  AuditLog audit_log = 1;
}

message ListAuditLogsRequest {
  string actor_id = 1;
  string target_type = 2;
  string target_id = 3;
  google.protobuf.Timestamp from_time = 4;
  google.protobuf.Timestamp to_time = 5;
  int32 page = 6;
  int32 page_size = 7;
}

message ListAuditLogsResponse {
  repeated AuditLog logs = 1;
  int64 total = 2;
}

// Records a buyer's COD delivery rejection; idempotent per order_id.
message RecordCODRejectionRequest {
  string user_id = 1;
  string order_id = 2;
  string reason = 3;
}

message RecordCODRejectionResponse {
  int32 cod_rejected_count = 1;
  bool already_recorded = 2;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  bool sent = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {
  bool ok = 1;
}

message ShopBankAccount {
  string id = 1;
  string shop_id = 2;
  string bank_code = 3;
  string bank_name = 4;
  string account_number_masked = 5;
  // Populated ONLY by internal service-token GetShopBankAccountForPayout; always empty for all end-user callers (including sellers and admins).
  string account_number = 6;
  string account_holder_name = 7;
  bool holder_name_matched = 8;
  ShopBankAccountStatus status = 9;
  string review_note = 10;
  // Set to now + 24h whenever a shop changes its verified bank account (anti-takeover payout lock).
  google.protobuf.Timestamp payout_locked_until = 11;
  google.protobuf.Timestamp verified_at = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message AddShopBankAccountRequest {
  // Optional for seller (always overridden by verified JWT shop_id).
  string shop_id = 1;
  string bank_code = 2;
  string bank_name = 3;
  string account_number = 4;
  string account_holder_name = 5;
}

message AddShopBankAccountResponse {
  ShopBankAccount bank_account = 1;
  bool otp_sent = 2;
}

message VerifyShopBankAccountOTPRequest {
  // Optional for seller (always overridden by verified JWT shop_id).
  string shop_id = 1;
  string otp = 2;
}

message VerifyShopBankAccountOTPResponse {
  ShopBankAccount bank_account = 1;
}

message GetShopBankAccountRequest {
  // Optional for seller (always overridden by verified JWT shop_id); required for admin.
  string shop_id = 1;
}

message GetShopBankAccountResponse {
  ShopBankAccount bank_account = 1;
}

message AdminReviewShopBankAccountRequest {
  string shop_id = 1;
  string bank_account_id = 2;
  // Valid values: REVIEW_DECISION_APPROVE or REVIEW_DECISION_REJECT.
  ReviewDecision decision = 3;
  string reason = 4;
}

message AdminReviewShopBankAccountResponse {
  ShopBankAccount bank_account = 1;
}

message DailyUserShopStat {
  // Vietnam date in YYYY-MM-DD (Asia/Ho_Chi_Minh).
  string date = 1;
  int64 new_users = 2;
  int64 new_shops = 3;
}

message GetPlatformUserStatsRequest {
  // Vietnam dates YYYY-MM-DD inclusive (max span 366 days).
  string from_date = 1;
  string to_date = 2;
}

message GetPlatformUserStatsResponse {
  string from_date = 1;
  string to_date = 2;
  int64 total_users = 3;
  int64 active_users = 4;
  int64 new_users = 5;
  int64 total_shops = 6;
  int64 active_shops = 7;
  int64 pending_shops = 8;
  int64 new_shops = 9;
  repeated DailyUserShopStat daily = 10;
}

message GetShopBankAccountForPayoutRequest {
  string shop_id = 1;
}

message GetShopBankAccountForPayoutResponse {
  ShopBankAccount bank_account = 1;
}

service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc VerifyOTP(VerifyOTPRequest) returns (VerifyOTPResponse);
  rpc ResendOTP(ResendOTPRequest) returns (ResendOTPResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ValidateUser(ValidateUserRequest) returns (ValidateUserResponse);
  rpc AdminListUsers(AdminListUsersRequest) returns (AdminListUsersResponse);
  rpc AdminUpdateUserStatus(AdminUpdateUserStatusRequest) returns (AdminUpdateUserStatusResponse);
  rpc AdminUpdateUserRole(AdminUpdateUserRoleRequest) returns (AdminUpdateUserRoleResponse);
  rpc RegisterShop(RegisterShopRequest) returns (RegisterShopResponse);
  rpc GetShop(GetShopRequest) returns (GetShopResponse);
  rpc ListPublicShops(ListPublicShopsRequest) returns (ListPublicShopsResponse);
  rpc AdminListShops(AdminListShopsRequest) returns (AdminListShopsResponse);
  rpc AdminReviewShop(AdminReviewShopRequest) returns (AdminReviewShopResponse);
  rpc CreateAddress(CreateAddressRequest) returns (CreateAddressResponse);
  rpc ListAddresses(ListAddressesRequest) returns (ListAddressesResponse);
  rpc GetAddress(GetAddressRequest) returns (GetAddressResponse);
  rpc UpdateAddress(UpdateAddressRequest) returns (UpdateAddressResponse);
  rpc DeleteAddress(DeleteAddressRequest) returns (DeleteAddressResponse);
  rpc WriteAuditLog(WriteAuditLogRequest) returns (WriteAuditLogResponse);
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);
  rpc RecordCODRejection(RecordCODRejectionRequest) returns (RecordCODRejectionResponse);
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc AddShopBankAccount(AddShopBankAccountRequest) returns (AddShopBankAccountResponse);
  rpc VerifyShopBankAccountOTP(VerifyShopBankAccountOTPRequest) returns (VerifyShopBankAccountOTPResponse);
  rpc GetShopBankAccount(GetShopBankAccountRequest) returns (GetShopBankAccountResponse);
  rpc AdminReviewShopBankAccount(AdminReviewShopBankAccountRequest) returns (AdminReviewShopBankAccountResponse);
  rpc GetPlatformUserStats(GetPlatformUserStatsRequest) returns (GetPlatformUserStatsResponse);
  rpc GetShopBankAccountForPayout(GetShopBankAccountForPayoutRequest) returns (GetShopBankAccountForPayoutResponse);
}
