syntax = "proto3";

package nexusmart.user.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nexusmart/core/gen/go/nexusmart/user/v1;userv1";

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_BUYER = 1;
  USER_ROLE_SELLER = 2;
  USER_ROLE_ADMIN = 3;
  USER_ROLE_SUPER_ADMIN = 4;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_PENDING_VERIFICATION = 1;
  USER_STATUS_ACTIVE = 2;
  USER_STATUS_LOCKED = 3;
}

enum ShopStatus {
  SHOP_STATUS_UNSPECIFIED = 0;
  SHOP_STATUS_PENDING = 1;
  SHOP_STATUS_ACTIVE = 2;
  SHOP_STATUS_REJECTED = 3;
  SHOP_STATUS_SUSPENDED = 4;
}

enum ReviewDecision {
  REVIEW_DECISION_UNSPECIFIED = 0;
  REVIEW_DECISION_APPROVE = 1;
  REVIEW_DECISION_REJECT = 2;
  REVIEW_DECISION_REQUEST_INFO = 3;
}

enum SiteStatus {
  SITE_STATUS_UNSPECIFIED = 0;
  SITE_STATUS_DRAFT = 1;
  SITE_STATUS_PUBLISHED = 2;
  SITE_STATUS_SUSPENDED = 3;
}

message User {
  string id = 1;
  string full_name = 2;
  string email = 3;
  string phone = 4;
  UserRole role = 5;
  UserStatus status = 6;
  string shop_id = 7;
  bool phone_verified = 8;
  int32 cod_rejected_count = 9;
  string avatar_url = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message Shop {
  string id = 1;
  string owner_user_id = 2;
  string name = 3;
  string description = 4;
  string pickup_address_id = 5;
  string contact_phone = 6;
  string business_license_doc = 7;
  ShopStatus status = 8;
  string rejection_reason = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message Address {
  string id = 1;
  string user_id = 2;
  string recipient_name = 3;
  string recipient_phone = 4;
  string province_code = 5;
  string province_name = 6;
  string ward_code = 7;
  string ward_name = 8;
  string street_address = 9;
  string legacy_province_code = 10;
  string legacy_district_code = 11;
  string legacy_ward_code = 12;
  bool is_default = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message AuditLog {
  string id = 1;
  string actor_id = 2;
  string actor_role = 3;
  string action = 4;
  string target_type = 5;
  string target_id = 6;
  string before_json = 7;
  string after_json = 8;
  string reason = 9;
  string ip_address = 10;
  google.protobuf.Timestamp created_at = 11;
}

message RegisterRequest {
  string full_name = 1;
  string email = 2;
  string phone = 3;
  string password = 4;
}

message RegisterResponse {
  string user_id = 1;
  string email = 2;
  string status = 3;
}

message VerifyOTPRequest {
  string email = 1;
  string otp = 2;
}

message VerifyOTPResponse {
  bool verified = 1;
  User user = 2;
}

message ResendOTPRequest {
  string email = 1;
}

message ResendOTPResponse {
  bool sent = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in_seconds = 3;
  User user = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in_seconds = 3;
}

message LogoutRequest {
  string refresh_token = 1;
  string user_id = 2;
}

message LogoutResponse {
  bool ok = 1;
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  User user = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  string full_name = 2;
  string phone = 3;
  string avatar_url = 4;
}

message UpdateProfileResponse {
  User user = 1;
}

message ValidateUserRequest {
  string user_id = 1;
}

message ValidateUserResponse {
  bool valid = 1;
  UserRole role = 2;
  UserStatus status = 3;
  string shop_id = 4;
  bool phone_verified = 5;
  int32 cod_rejected_count = 6;
}

message AdminListUsersRequest {
  string query = 1;
  UserRole role = 2;
  UserStatus status = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message AdminListUsersResponse {
  repeated User users = 1;
  int64 total = 2;
}

message AdminUpdateUserStatusRequest {
  string admin_id = 1;
  string target_user_id = 2;
  UserStatus status = 3;
  string reason = 4;
}

message AdminUpdateUserStatusResponse {
  User user = 1;
}

message AdminUpdateUserRoleRequest {
  string admin_id = 1;
  string target_user_id = 2;
  UserRole role = 3;
  string reason = 4;
}

message AdminUpdateUserRoleResponse {
  User user = 1;
}

message RegisterShopRequest {
  string user_id = 1;
  string name = 2;
  string description = 3;
  string pickup_address_id = 4;
  string contact_phone = 5;
  string business_license_doc = 6;
}

message RegisterShopResponse {
  Shop shop = 1;
}

message GetShopRequest {
  string shop_id = 1;
  string owner_user_id = 2;
}

message GetShopResponse {
  Shop shop = 1;
}

message AdminListShopsRequest {
  ShopStatus status = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message AdminListShopsResponse {
  repeated Shop shops = 1;
  int64 total = 2;
}

// ListActiveShopsRequest lists storefront-visible (ACTIVE) shops; no auth required.
message ListActiveShopsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListActiveShopsResponse {
  repeated Shop shops = 1;
  int64 total = 2;
}

message AdminReviewShopRequest {
  string admin_id = 1;
  string shop_id = 2;
  ReviewDecision decision = 3;
  string reason = 4;
}

message AdminReviewShopResponse {
  Shop shop = 1;
}

message CreateAddressRequest {
  string user_id = 1;
  string recipient_name = 2;
  string recipient_phone = 3;
  string province_code = 4;
  string province_name = 5;
  string ward_code = 6;
  string ward_name = 7;
  string street_address = 8;
  string legacy_province = 9;
  string legacy_district = 10;
  string legacy_ward = 11;
  bool is_default = 12;
}

message CreateAddressResponse {
  Address address = 1;
}

message ListAddressesRequest {
  string user_id = 1;
}

message ListAddressesResponse {
  repeated Address addresses = 1;
}

message GetAddressRequest {
  string user_id = 1;
  string address_id = 2;
}

message GetAddressResponse {
  Address address = 1;
}

message UpdateAddressRequest {
  string user_id = 1;
  string address_id = 2;
  string recipient_name = 3;
  string recipient_phone = 4;
  string province_code = 5;
  string province_name = 6;
  string ward_code = 7;
  string ward_name = 8;
  string street_address = 9;
  bool is_default = 10;
}

message UpdateAddressResponse {
  Address address = 1;
}

message DeleteAddressRequest {
  string user_id = 1;
  string address_id = 2;
}

message DeleteAddressResponse {
  bool ok = 1;
}

message WriteAuditLogRequest {
  string actor_id = 1;
  string actor_role = 2;
  string action = 3;
  string target_type = 4;
  string target_id = 5;
  string before_json = 6;
  string after_json = 7;
  string reason = 8;
  string ip_address = 9;
}

message WriteAuditLogResponse {
  AuditLog audit_log = 1;
}

message ListAuditLogsRequest {
  string actor_id = 1;
  string target_type = 2;
  string target_id = 3;
  google.protobuf.Timestamp from_time = 4;
  google.protobuf.Timestamp to_time = 5;
  int32 page = 6;
  int32 page_size = 7;
}

message ListAuditLogsResponse {
  repeated AuditLog logs = 1;
  int64 total = 2;
}

message PublicShop {
  string id = 1;
  string name = 2;
  string description = 3;
  ShopStatus status = 4;
}

message Site {
  string id = 1;
  string shop_id = 2;
  string shop_name = 3;
  string subdomain = 4;
  string primary_host = 5;
  SiteStatus status = 6;
  string config_json = 7;
  string published_version_id = 8;
  int32 published_version_number = 9;
  google.protobuf.Timestamp published_at = 10;
  string suspended_reason = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message SiteVersion {
  string id = 1;
  string site_id = 2;
  int32 version_number = 3;
  string config_json = 4;
  string published_by = 5;
  string note = 6;
  google.protobuf.Timestamp created_at = 7;
}

message GetSiteByHostRequest {
  string host = 1;
}

message GetSiteByHostResponse {
  Site site = 1;
  PublicShop shop = 2;
}

message GetSiteByShopRequest {
  string shop_id = 1;
}

message GetSiteByShopResponse {
  Site site = 1;
  PublicShop shop = 2;
}

message GetSiteDraftRequest {
  string shop_id = 1;
}

message GetSiteDraftResponse {
  Site site = 1;
}

message SaveSiteDraftRequest {
  string shop_id = 1;
  string subdomain = 2;
  string config_json = 3;
}

message SaveSiteDraftResponse {
  Site site = 1;
}

message PublishSiteRequest {
  string shop_id = 1;
  string note = 2;
}

message PublishSiteResponse {
  Site site = 1;
  SiteVersion version = 2;
}

message RollbackSiteRequest {
  string shop_id = 1;
  string version_id = 2;
  string note = 3;
}

message RollbackSiteResponse {
  Site site = 1;
  SiteVersion version = 2;
}

message ListSiteVersionsRequest {
  string shop_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListSiteVersionsResponse {
  repeated SiteVersion versions = 1;
  int64 total = 2;
}

message ListSitesRequest {
  SiteStatus status = 1;
  string query = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListSitesResponse {
  repeated Site sites = 1;
  int64 total = 2;
}

message SuspendSiteRequest {
  string site_id = 1;
  bool suspend = 2;
  string reason = 3;
}

message SuspendSiteResponse {
  Site site = 1;
}

// PublishedSiteSummary is the public directory card of a PUBLISHED site whose shop is ACTIVE.
// Fields come only from the published config and public shop profile (never the draft).
message PublishedSiteSummary {
  string site_id = 1;
  string shop_id = 2;
  string shop_name = 3;
  string subdomain = 4;
  string primary_host = 5;
  string logo_url = 6;
  string cover_url = 7;
  string tagline = 8;
  google.protobuf.Timestamp published_at = 9;
}

// ListPublishedSitesRequest is public (no JWT). page_size defaults to 24, capped at 48.
message ListPublishedSitesRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListPublishedSitesResponse {
  repeated PublishedSiteSummary sites = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message DomainVerificationRecord {
  string type = 1;
  string name = 2;
  string value = 3;
}

message Domain {
  string id = 1;
  string host = 2;
  string kind = 3;
  string status = 4;
  bool is_primary = 5;
  repeated DomainVerificationRecord verification = 6;
  string last_error = 7;
  google.protobuf.Timestamp verified_at = 8;
  google.protobuf.Timestamp created_at = 9;
}

message AddCustomDomainRequest {
  string shop_id = 1;
  string hostname = 2;
}

message AddCustomDomainResponse {
  Domain domain = 1;
}

message CheckCustomDomainRequest {
  string shop_id = 1;
  string domain_id = 2;
}

message CheckCustomDomainResponse {
  Domain domain = 1;
}

message RemoveCustomDomainRequest {
  string shop_id = 1;
  string domain_id = 2;
}

message RemoveCustomDomainResponse {}

message ListSiteDomainsRequest {
  string shop_id = 1;
}

message ListSiteDomainsResponse {
  repeated Domain domains = 1;
}

service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc VerifyOTP(VerifyOTPRequest) returns (VerifyOTPResponse);
  rpc ResendOTP(ResendOTPRequest) returns (ResendOTPResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ValidateUser(ValidateUserRequest) returns (ValidateUserResponse);
  rpc AdminListUsers(AdminListUsersRequest) returns (AdminListUsersResponse);
  rpc AdminUpdateUserStatus(AdminUpdateUserStatusRequest) returns (AdminUpdateUserStatusResponse);
  rpc AdminUpdateUserRole(AdminUpdateUserRoleRequest) returns (AdminUpdateUserRoleResponse);
  rpc RegisterShop(RegisterShopRequest) returns (RegisterShopResponse);
  rpc GetShop(GetShopRequest) returns (GetShopResponse);
  rpc AdminListShops(AdminListShopsRequest) returns (AdminListShopsResponse);
  rpc ListActiveShops(ListActiveShopsRequest) returns (ListActiveShopsResponse);
  rpc AdminReviewShop(AdminReviewShopRequest) returns (AdminReviewShopResponse);
  rpc CreateAddress(CreateAddressRequest) returns (CreateAddressResponse);
  rpc ListAddresses(ListAddressesRequest) returns (ListAddressesResponse);
  rpc GetAddress(GetAddressRequest) returns (GetAddressResponse);
  rpc UpdateAddress(UpdateAddressRequest) returns (UpdateAddressResponse);
  rpc DeleteAddress(DeleteAddressRequest) returns (DeleteAddressResponse);
  rpc WriteAuditLog(WriteAuditLogRequest) returns (WriteAuditLogResponse);
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);
  rpc GetSiteByHost(GetSiteByHostRequest) returns (GetSiteByHostResponse);
  rpc GetSiteByShop(GetSiteByShopRequest) returns (GetSiteByShopResponse);
  rpc GetSiteDraft(GetSiteDraftRequest) returns (GetSiteDraftResponse);
  rpc SaveSiteDraft(SaveSiteDraftRequest) returns (SaveSiteDraftResponse);
  rpc PublishSite(PublishSiteRequest) returns (PublishSiteResponse);
  rpc RollbackSite(RollbackSiteRequest) returns (RollbackSiteResponse);
  rpc ListSiteVersions(ListSiteVersionsRequest) returns (ListSiteVersionsResponse);
  rpc ListSites(ListSitesRequest) returns (ListSitesResponse);
  rpc SuspendSite(SuspendSiteRequest) returns (SuspendSiteResponse);
  rpc ListPublishedSites(ListPublishedSitesRequest) returns (ListPublishedSitesResponse);
  rpc AddCustomDomain(AddCustomDomainRequest) returns (AddCustomDomainResponse);
  rpc CheckCustomDomain(CheckCustomDomainRequest) returns (CheckCustomDomainResponse);
  rpc RemoveCustomDomain(RemoveCustomDomainRequest) returns (RemoveCustomDomainResponse);
  rpc ListSiteDomains(ListSiteDomainsRequest) returns (ListSiteDomainsResponse);
}
