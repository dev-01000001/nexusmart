syntax = "proto3";

package nexusmart.product.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nexusmart/core/gen/go/nexusmart/product/v1;productv1";

enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_PENDING = 1;
  PRODUCT_STATUS_APPROVED = 2;
  PRODUCT_STATUS_REJECTED = 3;
  PRODUCT_STATUS_HIDDEN = 4;
  PRODUCT_STATUS_OUT_OF_STOCK = 5;
}

enum ProductReviewDecision {
  PRODUCT_REVIEW_DECISION_UNSPECIFIED = 0;
  PRODUCT_REVIEW_DECISION_APPROVE = 1;
  PRODUCT_REVIEW_DECISION_REJECT = 2;
}

enum ReviewStatus {
  REVIEW_STATUS_UNSPECIFIED = 0;
  REVIEW_STATUS_PUBLISHED = 1;
  REVIEW_STATUS_HIDDEN = 2;
}

enum BannedKeywordAction {
  BANNED_KEYWORD_ACTION_UNSPECIFIED = 0;
  BANNED_KEYWORD_ACTION_BLOCK = 1;
  BANNED_KEYWORD_ACTION_REVIEW = 2;
}

message Category {
  string id = 1;
  string name = 2;
  string slug = 3;
  string parent_id = 4;
  int32 commission_rate_bps = 5;
  int32 sort_order = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // Prohibited category flag (E10): creating/updating/approving products in this category or any descendant is rejected.
  bool is_prohibited = 9;
}

message SKU {
  string id = 1;
  string product_id = 2;
  string shop_id = 3;
  string product_name = 4;
  string sku_code = 5;
  string name = 6;
  map<string, string> attributes = 7;
  int64 price_vnd = 8;
  int32 stock = 9;
  int32 reserved_stock = 10;
  int32 available_stock = 11;
  int64 version = 12;
  int32 weight_grams = 13;
  string image_url = 14;
  string category_id = 15;
  int32 commission_rate_bps = 16;
  bool is_active = 17;
  // Lowest recorded price for this SKU in the last 30 days (defaults to price_vnd when no lower history exists).
  int64 min_price_30d_vnd = 18;
}

message SKUInput {
  string id = 1;
  string sku_code = 2;
  string name = 3;
  map<string, string> attributes = 4;
  int64 price_vnd = 5;
  int32 stock = 6;
  int32 weight_grams = 7;
  string image_url = 8;
}

message Product {
  string id = 1;
  string shop_id = 2;
  string category_id = 3;
  string name = 4;
  string description = 5;
  repeated string images = 6;
  ProductStatus status = 7;
  string rejection_reason = 8;
  int64 min_price_vnd = 9;
  int64 max_price_vnd = 10;
  repeated SKU skus = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  string slug = 14;
  // Integer average rating scaled by 100 (0..500, e.g. 475 = 4.75 stars; never float) (E6/E14).
  int32 rating_avg_x100 = 15;
  int32 review_count = 16;
  // Matched REVIEW-level banned keywords for moderation visibility (omitted from public gateway JSON) (E10).
  repeated string flagged_keywords = 17;
}

message CreateCategoryRequest {
  string name = 1;
  string slug = 2;
  string parent_id = 3;
  int32 commission_rate_bps = 4;
  int32 sort_order = 5;
  bool is_prohibited = 6;
}

message CreateCategoryResponse {
  Category category = 1;
}

message UpdateCategoryRequest {
  string id = 1;
  string name = 2;
  string slug = 3;
  string parent_id = 4;
  int32 commission_rate_bps = 5;
  int32 sort_order = 6;
  // Presence flags so omitted fields on partial updates do not reset existing values (CAT-B9).
  bool has_commission_rate_bps = 7;
  bool has_sort_order = 8;
  bool has_parent_id = 9;
  bool is_prohibited = 10;
  bool has_is_prohibited = 11;
}

message UpdateCategoryResponse {
  Category category = 1;
}

message DeleteCategoryRequest {
  string id = 1;
}

message DeleteCategoryResponse {
  bool ok = 1;
}

message ListCategoriesRequest {
  string parent_id = 1;
}

message ListCategoriesResponse {
  repeated Category categories = 1;
}

message CreateProductRequest {
  string shop_id = 1;
  string category_id = 2;
  string name = 3;
  string description = 4;
  repeated string images = 5;
  repeated SKUInput skus = 6;
  string slug = 7;
}

message CreateProductResponse {
  Product product = 1;
}

message UpdateProductRequest {
  string id = 1;
  string shop_id = 2;
  string category_id = 3;
  string name = 4;
  string description = 5;
  repeated string images = 6;
  ProductStatus status = 7;
  repeated SKUInput skus = 8;
  string slug = 9;
}

message UpdateProductResponse {
  Product product = 1;
}

message DeleteProductRequest {
  string id = 1;
  string shop_id = 2;
}

message DeleteProductResponse {
  bool ok = 1;
}

message AdminReviewProductRequest {
  string admin_id = 1;
  string product_id = 2;
  ProductReviewDecision decision = 3;
  string reason = 4;
}

message AdminReviewProductResponse {
  Product product = 1;
}

message GetProductRequest {
  string id = 1;
  string slug = 2;
  // When true on a public slug lookup, previously-approved products that are now HIDDEN/REJECTED/soft-deleted
  // return a discontinued stub instead of NotFound; unknown or never-approved slugs still return NotFound (E13).
  bool include_discontinued_stub = 3;
}

message GetProductResponse {
  Product product = 1;
  bool discontinued = 2;
  string discontinued_category_id = 3;
  // Populated ONLY when the discontinued product's current status is HIDDEN (empty for REJECTED or soft-deleted) (E13).
  string discontinued_name = 4;
}

message ListProductsRequest {
  string category_id = 1;
  string keyword = 2;
  string shop_id = 3;
  ProductStatus status = 4;
  int64 min_price_vnd = 5;
  int64 max_price_vnd = 6;
  string sort_by = 7;
  int32 page = 8;
  int32 page_size = 9;
  // Optional filter (max 200): return ACTIVE/public products containing any of these SKU IDs (D8/A3).
  repeated string sku_ids = 10;
}

message ListProductsResponse {
  repeated Product products = 1;
  int64 total = 2;
}

message GetSKUsBatchRequest {
  repeated string sku_ids = 1;
}

message GetSKUsBatchResponse {
  repeated SKU skus = 1;
}

message UpdateStockRequest {
  string sku_id = 1;
  string shop_id = 2;
  int32 new_stock = 3;
  int64 expected_version = 4;
}

message UpdateStockResponse {
  SKU sku = 1;
}

message StockReservationItem {
  string sku_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  string order_id = 1;
  repeated StockReservationItem items = 2;
}

message ReserveStockResponse {
  bool reserved = 1;
  string reservation_id = 2;
  bool already_reserved = 3;
}

message ReleaseStockRequest {
  string order_id = 1;
}

message ReleaseStockResponse {
  bool released = 1;
  bool already_released = 2;
}

message ConfirmStockRequest {
  string order_id = 1;
}

message ConfirmStockResponse {
  bool confirmed = 1;
  bool already_confirmed = 2;
}

message RestockOrderItemsRequest {
  string order_id = 1;
  repeated StockReservationItem items = 2;
}

message RestockOrderItemsResponse {
  bool restocked = 1;
  bool already_restocked = 2;
}

message GetCategoryDescendantsRequest {
  repeated string category_ids = 1;
}

message GetCategoryDescendantsResponse {
  // All input category IDs plus all recursive descendant category IDs (deduplicated).
  repeated string category_ids = 1;
}

message CategoryFeeSchedule {
  string id = 1;
  string category_id = 2;
  int32 commission_rate_bps = 3;
  google.protobuf.Timestamp effective_from = 4;
  string created_by = 5;
  string note = 6;
  google.protobuf.Timestamp created_at = 7;
}

message SetCategoryFeeScheduleRequest {
  string category_id = 1;
  int32 commission_rate_bps = 2;
  // Empty/nil defaults to now (effective immediately).
  google.protobuf.Timestamp effective_from = 3;
  string note = 4;
}

message SetCategoryFeeScheduleResponse {
  CategoryFeeSchedule schedule = 1;
}

message ListCategoryFeeSchedulesRequest {
  // Optional: filter to one category; empty lists schedules across all categories.
  string category_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListCategoryFeeSchedulesResponse {
  repeated CategoryFeeSchedule schedules = 1;
  int64 total = 2;
}

message ProductReview {
  string id = 1;
  string product_id = 2;
  string shop_id = 3;
  string order_id = 4;
  string order_item_id = 5;
  string sku_id = 6;
  string sku_name = 7;
  string buyer_id = 8;
  // Masked display name snapshotted from UserService.GetProfile at creation time (E5).
  string buyer_name = 9;
  int32 rating = 10;
  string comment = 11;
  repeated string image_urls = 12;
  ReviewStatus status = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message CreateReviewRequest {
  string order_id = 1;
  string order_item_id = 2;
  int32 rating = 3;
  string comment = 4;
  // Max 5 URLs (<= 500 chars each, https:// or internal /products/... only) (E7).
  repeated string image_urls = 5;
}

message CreateReviewResponse {
  ProductReview review = 1;
}

message ListProductReviewsRequest {
  string product_id = 1;
  // Optional 1..5 filter; 0 returns all ratings.
  int32 rating_filter = 2;
  bool has_images = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListProductReviewsResponse {
  repeated ProductReview reviews = 1;
  int64 total = 2;
  int32 rating_avg_x100 = 3;
  int32 review_count = 4;
  map<int32, int32> rating_counts = 5;
}

message ListOrderReviewsRequest {
  string order_id = 1;
}

message ListOrderReviewsResponse {
  repeated ProductReview reviews = 1;
}

message BannedKeyword {
  string id = 1;
  string term = 2;
  string normalized_term = 3;
  string category = 4;
  BannedKeywordAction action = 5;
  bool is_active = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message BannedContentProductSample {
  string product_id = 1;
  string shop_id = 2;
  string name = 3;
  string slug = 4;
  ProductStatus status = 5;
  repeated string matched_terms = 6;
  BannedKeywordAction highest_action = 7;
}

message ListBannedKeywordsRequest {
  string query = 1;
  BannedKeywordAction action = 2;
  bool include_inactive = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListBannedKeywordsResponse {
  repeated BannedKeyword keywords = 1;
  int64 total = 2;
}

message CreateBannedKeywordRequest {
  string term = 1;
  string category = 2;
  BannedKeywordAction action = 3;
}

message CreateBannedKeywordResponse {
  BannedKeyword keyword = 1;
}

message UpdateBannedKeywordRequest {
  string id = 1;
  string term = 2;
  string category = 3;
  BannedKeywordAction action = 4;
  bool is_active = 5;
  bool has_is_active = 6;
}

message UpdateBannedKeywordResponse {
  BannedKeyword keyword = 1;
}

message DeleteBannedKeywordRequest {
  string id = 1;
}

message DeleteBannedKeywordResponse {
  bool ok = 1;
}

message PreviewBannedKeywordRequest {
  string term = 1;
}

message PreviewBannedKeywordResponse {
  int64 affected_count = 1;
  // Up to 20 sample products matching the term (E11).
  repeated BannedContentProductSample samples = 2;
}

message RescanProductsForBannedContentRequest {
  // Optional subset of banned_keywords.id values; empty scans against all active rules and prohibited categories.
  repeated string keyword_ids = 1;
  bool dry_run = 2;
  // Opaque pagination cursor from the previous batch's next_cursor (E11).
  string cursor = 3;
  // Batch size (default 500, capped at 500 per E11).
  int32 limit = 4;
}

message RescanProductsForBannedContentResponse {
  int32 scanned_count = 1;
  int32 blocked_count = 2;
  int32 flagged_count = 3;
  // Up to 20 sample affected products in this batch (E11).
  repeated BannedContentProductSample samples = 4;
  bool has_more = 5;
  string next_cursor = 6;
}

service ProductService {
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc GetCategoryDescendants(GetCategoryDescendantsRequest) returns (GetCategoryDescendantsResponse);
  rpc SetCategoryFeeSchedule(SetCategoryFeeScheduleRequest) returns (SetCategoryFeeScheduleResponse);
  rpc ListCategoryFeeSchedules(ListCategoryFeeSchedulesRequest) returns (ListCategoryFeeSchedulesResponse);
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse);
  rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse);
  rpc AdminReviewProduct(AdminReviewProductRequest) returns (AdminReviewProductResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc GetSKUsBatch(GetSKUsBatchRequest) returns (GetSKUsBatchResponse);
  rpc UpdateStock(UpdateStockRequest) returns (UpdateStockResponse);
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
  rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);
  rpc ConfirmStock(ConfirmStockRequest) returns (ConfirmStockResponse);
  rpc RestockOrderItems(RestockOrderItemsRequest) returns (RestockOrderItemsResponse);
  rpc CreateReview(CreateReviewRequest) returns (CreateReviewResponse);
  rpc ListProductReviews(ListProductReviewsRequest) returns (ListProductReviewsResponse);
  rpc ListOrderReviews(ListOrderReviewsRequest) returns (ListOrderReviewsResponse);
  rpc ListBannedKeywords(ListBannedKeywordsRequest) returns (ListBannedKeywordsResponse);
  rpc CreateBannedKeyword(CreateBannedKeywordRequest) returns (CreateBannedKeywordResponse);
  rpc UpdateBannedKeyword(UpdateBannedKeywordRequest) returns (UpdateBannedKeywordResponse);
  rpc DeleteBannedKeyword(DeleteBannedKeywordRequest) returns (DeleteBannedKeywordResponse);
  rpc PreviewBannedKeyword(PreviewBannedKeywordRequest) returns (PreviewBannedKeywordResponse);
  rpc RescanProductsForBannedContent(RescanProductsForBannedContentRequest) returns (RescanProductsForBannedContentResponse);
}
