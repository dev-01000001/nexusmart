syntax = "proto3";

package nexusmart.search.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nexusmart/core/gen/go/nexusmart/search/v1;searchv1";

enum SearchMode {
  SEARCH_MODE_UNSPECIFIED = 0;
  SEARCH_MODE_AUTO = 1;
  SEARCH_MODE_KEYWORD = 2;
  SEARCH_MODE_HYBRID = 3;
}

enum ReindexJobStatus {
  REINDEX_JOB_STATUS_UNSPECIFIED = 0;
  REINDEX_JOB_STATUS_RUNNING = 1;
  REINDEX_JOB_STATUS_COMPLETED = 2;
  REINDEX_JOB_STATUS_FAILED = 3;
}

// Public search hit for catalog cards & RAG (B1, G9). Strictly omits commission_rate_bps.
message SearchProductHit {
  string id = 1;
  string shop_id = 2;
  string shop_name = 3;
  string shop_slug = 4;
  string category_id = 5;
  string category_slug = 6;
  string category_name = 7;
  string name = 8;
  string slug = 9;
  string thumbnail_url = 10;
  int64 min_price_vnd = 11;
  int64 max_price_vnd = 12;
  string status = 13;
  // Real integer average rating scaled by 100 (0..500, aligned with Product.rating_avg_x100, E6/G9).
  int32 rating_avg_x100 = 14;
  int32 review_count = 15;
  bool in_stock = 16;
  int32 sku_count = 17;
  double score = 18;
  string description_snippet = 19;
  repeated string sku_ids = 20;
  string default_sku_id = 21;
  repeated string colors = 22;
  repeated string sizes = 23;
}

message FacetCount {
  string id = 1;
  string name = 2;
  string slug = 3;
  int64 count = 4;
}

message SuggestEntity {
  string id = 1;
  string name = 2;
  string slug = 3;
}

message SearchHistoryItem {
  string id = 1;
  string query = 2;
  google.protobuf.Timestamp created_at = 3;
}

message SearchProductsRequest {
  string q = 1;
  string category_id = 2;
  string category_slug = 3;
  string shop_id = 4;
  string shop_slug = 5;
  int64 min_price_vnd = 6;
  int64 max_price_vnd = 7;
  // Optional integer rating threshold scaled by 100 (0..500, e.g. 400 = 4.0 stars; E6/G9).
  int32 min_rating_x100 = 8;
  bool in_stock_only = 9;
  // Supported values: "relevance" (default), "price_asc", "price_desc", "newest", "rating_desc".
  string sort_by = 10;
  SearchMode mode = 11;
  int32 page = 12;
  int32 page_size = 13;
  string size = 14;
  string color = 15;
}

message SearchProductsResponse {
  repeated SearchProductHit items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
  repeated FacetCount category_facets = 5;
  repeated FacetCount shop_facets = 6;
  string did_you_mean = 7;
  // "", "keyword_only", or "product_fallback" (G12/G13).
  string degraded_mode = 8;
  bool used_vector = 9;
}

message HybridSearchRequest {
  string query = 1;
  string category_id = 2;
  int64 min_price_vnd = 3;
  int64 max_price_vnd = 4;
  int32 limit = 5;
  bool include_out_of_stock = 6;
}

message HybridSearchResponse {
  repeated SearchProductHit hits = 1;
  bool used_vector = 2;
  string degraded_mode = 3;
}

message SuggestRequest {
  string query = 1;
  int32 limit = 2;
}

message SuggestResponse {
  repeated string keywords = 1;
  repeated SuggestEntity categories = 2;
  repeated SuggestEntity shops = 3;
  repeated string trending = 4;
  repeated SearchProductHit products = 5;
}

message ListSearchHistoryRequest {
  // Max 50 items per authenticated user (G14).
  int32 limit = 1;
}

message ListSearchHistoryResponse {
  repeated SearchHistoryItem items = 1;
}

message DeleteSearchHistoryRequest {
  string id = 1;
  bool clear_all = 2;
}

message DeleteSearchHistoryResponse {
  bool ok = 1;
}

message ReindexAllRequest {
  bool reindex_products = 1;
  bool reindex_embeddings = 2;
  bool reindex_categories = 3;
  bool reindex_shops = 4;
  // Keyset batch size (default 200, max 500 per G11).
  int32 batch_size = 5;
}

message ReindexAllResponse {
  string job_id = 1;
  ReindexJobStatus status = 2;
}

message GetReindexStatusRequest {
  string job_id = 1;
}

message GetReindexStatusResponse {
  string job_id = 1;
  ReindexJobStatus status = 2;
  int64 products_indexed = 3;
  int64 embeddings_updated = 4;
  string error_message = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
}

service SearchService {
  rpc SearchProducts(SearchProductsRequest) returns (SearchProductsResponse);
  rpc HybridSearch(HybridSearchRequest) returns (HybridSearchResponse);
  rpc Suggest(SuggestRequest) returns (SuggestResponse);
  rpc ListSearchHistory(ListSearchHistoryRequest) returns (ListSearchHistoryResponse);
  rpc DeleteSearchHistory(DeleteSearchHistoryRequest) returns (DeleteSearchHistoryResponse);
  rpc ReindexAll(ReindexAllRequest) returns (ReindexAllResponse);
  rpc GetReindexStatus(GetReindexStatusRequest) returns (GetReindexStatusResponse);
}
