syntax = "proto3";

package nexusmart.order.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nexusmart/core/gen/go/nexusmart/order/v1;orderv1";

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_CONFIRMED = 2;
  ORDER_STATUS_PREPARING = 3;
  ORDER_STATUS_SHIPPING = 4;
  ORDER_STATUS_DELIVERED = 5;
  ORDER_STATUS_COMPLETED = 6;
  ORDER_STATUS_CANCELLED = 7;
  ORDER_STATUS_RETURN_REQUESTED = 8;
  ORDER_STATUS_RETURNED = 9;
}

enum OrderPaymentMethod {
  ORDER_PAYMENT_METHOD_UNSPECIFIED = 0;
  ORDER_PAYMENT_METHOD_COD = 1;
  ORDER_PAYMENT_METHOD_VIETQR = 2;
}

enum PaymentResultStatus {
  PAYMENT_RESULT_STATUS_UNSPECIFIED = 0;
  PAYMENT_RESULT_STATUS_SUCCEEDED = 1;
  PAYMENT_RESULT_STATUS_FAILED = 2;
  PAYMENT_RESULT_STATUS_EXPIRED = 3;
}

enum ReturnStatus {
  RETURN_STATUS_UNSPECIFIED = 0;
  RETURN_STATUS_PENDING = 1;
  RETURN_STATUS_AWAITING_SHIPMENT = 2;
  RETURN_STATUS_IN_TRANSIT = 3;
  RETURN_STATUS_RECEIVED = 4;
  RETURN_STATUS_REFUNDING = 5;
  RETURN_STATUS_REFUNDED = 6;
  RETURN_STATUS_REJECTED = 7;
  RETURN_STATUS_ESCALATED = 8;
  RETURN_STATUS_EVIDENCE_REQUESTED = 9;
  RETURN_STATUS_CLOSED = 10;
}

enum ReturnSellerDecision {
  RETURN_SELLER_DECISION_UNSPECIFIED = 0;
  RETURN_SELLER_DECISION_ACCEPT_REFUND = 1;
  RETURN_SELLER_DECISION_ACCEPT_RETURN = 2;
  RETURN_SELLER_DECISION_REJECT = 3;
}

enum ReturnAdminDecision {
  RETURN_ADMIN_DECISION_UNSPECIFIED = 0;
  RETURN_ADMIN_DECISION_REFUND = 1;
  RETURN_ADMIN_DECISION_RETURN_AND_REFUND = 2;
  RETURN_ADMIN_DECISION_REJECT = 3;
  RETURN_ADMIN_DECISION_REQUEST_EVIDENCE = 4;
}

message OrderItem {
  string id = 1;
  string order_id = 2;
  string sku_id = 3;
  string product_id = 4;
  string product_name = 5;
  string sku_name = 6;
  int64 unit_price_vnd = 7;
  int64 effective_unit_price_vnd = 8;
  int32 quantity = 9;
  int64 line_total_vnd = 10;
  int32 weight_grams = 11;
  string flash_sale_item_id = 12;
  int32 commission_bps = 13;
  string shop_program_item_id = 14;
}

message OrderTimelineEvent {
  string id = 1;
  string order_id = 2;
  OrderStatus from_status = 3;
  OrderStatus to_status = 4;
  string actor_id = 5;
  string actor_role = 6;
  string note = 7;
  google.protobuf.Timestamp created_at = 8;
}

message OrderAddressSnapshot {
  string recipient_name = 1;
  string recipient_phone = 2;
  string province_code = 3;
  string province_name = 4;
  string ward_code = 5;
  string ward_name = 6;
  string street_address = 7;
}

message Order {
  string id = 1;
  string order_code = 2;
  string checkout_group_id = 3;
  string buyer_id = 4;
  string shop_id = 5;
  OrderStatus status = 6;
  OrderPaymentMethod payment_method = 7;
  string payment_id = 8;
  string payment_status = 9;
  int64 subtotal_vnd = 10;
  int64 flash_sale_discount_vnd = 11;
  int64 shop_voucher_discount_vnd = 12;
  int64 platform_voucher_discount_vnd = 13;
  int64 freeship_discount_vnd = 14;
  int64 coins_discount_vnd = 15;
  int64 shipping_fee_vnd = 16;
  int64 commission_vnd = 17;
  int64 total_payable_vnd = 18;
  string carrier_code = 19;
  string service_code = 20;
  string tracking_code = 21;
  string label_url = 22;
  string cancel_reason = 23;
  OrderAddressSnapshot shipping_address = 24;
  repeated OrderItem items = 25;
  repeated OrderTimelineEvent timeline = 26;
  google.protobuf.Timestamp payment_expires_at = 27;
  google.protobuf.Timestamp created_at = 28;
  google.protobuf.Timestamp updated_at = 29;
  google.protobuf.Timestamp delivered_at = 30;
  string return_request_id = 31;
  ReturnStatus return_status = 32;
  int64 shop_program_discount_vnd = 33;
  int64 shop_freeship_discount_vnd = 34;
  int64 payment_fee_vnd = 35;
  int32 payment_fee_bps = 36;
  // Populated only for admin/super_admin callers; always false for buyers and sellers.
  bool needs_manual_review = 37;
}

message ReturnEvent {
  string id = 1;
  ReturnStatus from_status = 2;
  ReturnStatus to_status = 3;
  string actor_id = 4;
  string actor_role = 5;
  string note = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ReturnRequest {
  string id = 1;
  string order_id = 2;
  string order_code = 3;
  string buyer_id = 4;
  string shop_id = 5;
  ReturnStatus status = 6;
  string reason = 7;
  repeated string evidence_urls = 8;
  string seller_response = 9;
  repeated string seller_evidence_urls = 10;
  string dispute_reason = 11;
  string admin_note = 12;
  int64 refund_amount_vnd = 13;
  string return_tracking_code = 14;
  string return_label_url = 15;
  int64 return_fee_vnd = 16;
  // Valid values: SELLER, BUYER, PLATFORM (empty before assigned).
  string return_fee_bearer = 17;
  bool goods_received = 18;
  google.protobuf.Timestamp deadline_at = 19;
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
  repeated ReturnEvent events = 22;
}

message CheckoutItemInput {
  string sku_id = 1;
  int32 quantity = 2;
  string flash_sale_item_id = 3;
  // Ignored when sent by clients; server resolves active shop discount programs authoritatively.
  string shop_program_item_id = 4;
}

message ShopShippingChoice {
  string shop_id = 1;
  string carrier_code = 2;
  string service_code = 3;
}

message CreateCheckoutRequest {
  string idempotency_key = 1;
  string buyer_id = 2;
  string address_id = 3;
  bool from_cart = 4;
  repeated CheckoutItemInput items = 5;
  map<string, string> shop_voucher_ids = 6;
  string platform_voucher_id = 7;
  string freeship_voucher_id = 8;
  int64 coins_to_use = 9;
  OrderPaymentMethod payment_method = 10;
  repeated ShopShippingChoice shipping_choices = 11;
}

message CreateCheckoutResponse {
  string checkout_group_id = 1;
  repeated Order orders = 2;
  string payment_id = 3;
  OrderPaymentMethod payment_method = 4;
  string payment_status = 5;
  string qr_url = 6;
  string qr_code = 7;
  google.protobuf.Timestamp payment_expires_at = 8;
  int64 total_payable_vnd = 9;
  bool idempotent_replay = 10;
  repeated string warnings = 11;
}

message GetOrderRequest {
  string order_id = 1;
  string actor_id = 2;
  string actor_role = 3;
  string actor_shop_id = 4;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  string buyer_id = 1;
  string shop_id = 2;
  OrderStatus status = 3;
  string role_scope = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int64 total = 2;
}

message CancelOrderRequest {
  string order_id = 1;
  string actor_id = 2;
  string actor_role = 3;
  string actor_shop_id = 4;
  string reason = 5;
}

message CancelOrderResponse {
  Order order = 1;
}

message SellerConfirmOrderRequest {
  string order_id = 1;
  string shop_id = 2;
  string seller_user_id = 3;
}

message SellerConfirmOrderResponse {
  Order order = 1;
}

message SellerShipOrderRequest {
  string order_id = 1;
  string shop_id = 2;
  string seller_user_id = 3;
  string carrier_code = 4;
  string service_code = 5;
}

message SellerShipOrderResponse {
  Order order = 1;
  string tracking_code = 2;
  string label_url = 3;
}

message BuyerConfirmReceivedRequest {
  string order_id = 1;
  string buyer_id = 2;
}

message BuyerConfirmReceivedResponse {
  Order order = 1;
}

message RequestReturnRequest {
  string order_id = 1;
  string buyer_id = 2;
  string reason = 3;
  repeated string evidence_urls = 4;
}

message RequestReturnResponse {
  Order order = 1;
  string return_request_id = 2;
}

message GetOrderTimelineRequest {
  string order_id = 1;
  string actor_id = 2;
  string actor_role = 3;
  string actor_shop_id = 4;
}

message GetOrderTimelineResponse {
  repeated OrderTimelineEvent events = 1;
}

message MarkPaymentResultRequest {
  string checkout_group_id = 1;
  string order_id = 2;
  string payment_id = 3;
  PaymentResultStatus status = 4;
  string reason = 5;
}

message MarkPaymentResultResponse {
  bool ok = 1;
}

message RetryPaymentRequest {
  string payment_id = 1;
  OrderPaymentMethod payment_method = 2;
  string idempotency_key = 3;
}

message RetryPaymentResponse {
  string checkout_group_id = 1;
  string payment_id = 2;
  google.protobuf.Timestamp payment_expires_at = 3;
}

message GetReturnRequestRequest {
  string return_request_id = 1;
  string order_id = 2;
}

message GetReturnRequestResponse {
  ReturnRequest return_request = 1;
}

message ListReturnRequestsRequest {
  // Valid values: buyer, seller, admin.
  string role_scope = 1;
  ReturnStatus status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListReturnRequestsResponse {
  repeated ReturnRequest return_requests = 1;
  int64 total = 2;
}

message RespondReturnRequest {
  string return_request_id = 1;
  ReturnSellerDecision decision = 2;
  string note = 3;
  repeated string evidence_urls = 4;
}

message RespondReturnResponse {
  ReturnRequest return_request = 1;
}

message EscalateReturnRequest {
  string return_request_id = 1;
  string reason = 2;
  repeated string evidence_urls = 3;
}

message EscalateReturnResponse {
  ReturnRequest return_request = 1;
}

message AddReturnEvidenceRequest {
  string return_request_id = 1;
  string note = 2;
  repeated string evidence_urls = 3;
}

message AddReturnEvidenceResponse {
  ReturnRequest return_request = 1;
}

message ConfirmReturnReceivedRequest {
  string return_request_id = 1;
}

message ConfirmReturnReceivedResponse {
  ReturnRequest return_request = 1;
}

message DisputeReturnGoodsRequest {
  string return_request_id = 1;
  string reason = 2;
  repeated string evidence_urls = 3;
}

message DisputeReturnGoodsResponse {
  ReturnRequest return_request = 1;
}

message AdminResolveReturnRequest {
  string return_request_id = 1;
  ReturnAdminDecision decision = 2;
  string note = 3;
  // Valid values: SELLER, BUYER, PLATFORM.
  string return_fee_bearer = 4;
}

message AdminResolveReturnResponse {
  ReturnRequest return_request = 1;
}

message OrderStatusCount {
  OrderStatus status = 1;
  int64 count = 2;
}

message DailyReportPoint {
  // Vietnam date in YYYY-MM-DD (Asia/Ho_Chi_Minh).
  string date = 1;
  int64 order_count = 2;
  int64 completed_count = 3;
  int64 cancelled_count = 4;
  int64 returned_count = 5;
  int64 gmv_vnd = 6;
  int64 net_revenue_vnd = 7;
  int64 commission_vnd = 8;
  int64 payment_fee_vnd = 9;
  // Populated only on GetPlatformReport; always 0 on GetSellerReport.
  int64 platform_subsidy_vnd = 10;
}

message TopProductStat {
  string product_id = 1;
  string product_name = 2;
  int64 units_sold = 3;
  int64 revenue_vnd = 4;
  int64 order_count = 5;
}

message GetSellerReportRequest {
  // Optional for seller (overridden by verified JWT shop_id); admin may specify shop_id.
  string shop_id = 1;
  // Vietnam dates YYYY-MM-DD inclusive (max span 366 days).
  string from_date = 2;
  string to_date = 3;
  // Max number of top products to return (default 10, max 50).
  int32 top_limit = 4;
}

message GetSellerReportResponse {
  string shop_id = 1;
  string from_date = 2;
  string to_date = 3;
  int64 gmv_vnd = 4;
  int64 net_revenue_vnd = 5;
  int64 commission_vnd = 6;
  int64 payment_fee_vnd = 7;
  int64 total_orders = 8;
  int64 completed_orders = 9;
  int64 cancelled_orders = 10;
  int64 returned_orders = 11;
  // Rates in basis points (0..10000, e.g. 1250 = 12.50%).
  int32 cancel_rate_bps = 12;
  int32 return_rate_bps = 13;
  repeated OrderStatusCount orders_by_status = 14;
  repeated DailyReportPoint daily = 15;
  repeated TopProductStat top_products = 16;
}

message GetPlatformReportRequest {
  // Vietnam dates YYYY-MM-DD inclusive (max span 366 days).
  string from_date = 1;
  string to_date = 2;
  int32 top_limit = 3;
}

message GetPlatformReportResponse {
  string from_date = 1;
  string to_date = 2;
  int64 gmv_vnd = 3;
  int64 net_revenue_vnd = 4;
  int64 commission_vnd = 5;
  int64 payment_fee_vnd = 6;
  int64 platform_subsidy_vnd = 7;
  int64 total_orders = 8;
  int64 completed_orders = 9;
  int64 cancelled_orders = 10;
  int64 returned_orders = 11;
  // Rates in basis points (0..10000).
  int32 cancel_rate_bps = 12;
  int32 return_rate_bps = 13;
  repeated OrderStatusCount orders_by_status = 14;
  repeated DailyReportPoint daily = 15;
  repeated TopProductStat top_products = 16;
}

message ListOrdersNeedingReviewRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListOrdersNeedingReviewResponse {
  repeated Order orders = 1;
  int64 total = 2;
}

message ResolveOrderReviewRequest {
  string order_id = 1;
  string note = 2;
}

message ResolveOrderReviewResponse {
  Order order = 1;
}

service OrderService {
  rpc CreateCheckout(CreateCheckoutRequest) returns (CreateCheckoutResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc SellerConfirmOrder(SellerConfirmOrderRequest) returns (SellerConfirmOrderResponse);
  rpc SellerShipOrder(SellerShipOrderRequest) returns (SellerShipOrderResponse);
  rpc BuyerConfirmReceived(BuyerConfirmReceivedRequest) returns (BuyerConfirmReceivedResponse);
  rpc RequestReturn(RequestReturnRequest) returns (RequestReturnResponse);
  rpc GetOrderTimeline(GetOrderTimelineRequest) returns (GetOrderTimelineResponse);
  rpc MarkPaymentResult(MarkPaymentResultRequest) returns (MarkPaymentResultResponse);
  rpc RetryPayment(RetryPaymentRequest) returns (RetryPaymentResponse);
  rpc GetReturnRequest(GetReturnRequestRequest) returns (GetReturnRequestResponse);
  rpc ListReturnRequests(ListReturnRequestsRequest) returns (ListReturnRequestsResponse);
  rpc RespondReturn(RespondReturnRequest) returns (RespondReturnResponse);
  rpc EscalateReturn(EscalateReturnRequest) returns (EscalateReturnResponse);
  rpc AddReturnEvidence(AddReturnEvidenceRequest) returns (AddReturnEvidenceResponse);
  rpc ConfirmReturnReceived(ConfirmReturnReceivedRequest) returns (ConfirmReturnReceivedResponse);
  rpc DisputeReturnGoods(DisputeReturnGoodsRequest) returns (DisputeReturnGoodsResponse);
  rpc AdminResolveReturn(AdminResolveReturnRequest) returns (AdminResolveReturnResponse);
  rpc GetSellerReport(GetSellerReportRequest) returns (GetSellerReportResponse);
  rpc GetPlatformReport(GetPlatformReportRequest) returns (GetPlatformReportResponse);
  rpc ListOrdersNeedingReview(ListOrdersNeedingReviewRequest) returns (ListOrdersNeedingReviewResponse);
  rpc ResolveOrderReview(ResolveOrderReviewRequest) returns (ResolveOrderReviewResponse);
}
