syntax = "proto3";

package nexusmart.payment.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nexusmart/core/gen/go/nexusmart/payment/v1;paymentv1";

enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_COD = 1;
  PAYMENT_METHOD_VIETQR = 2;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_SUCCEEDED = 2;
  PAYMENT_STATUS_FAILED = 3;
  PAYMENT_STATUS_EXPIRED = 4;
  PAYMENT_STATUS_CANCELLED = 5;
  PAYMENT_STATUS_REFUNDED = 6;
}

enum RefundStatus {
  REFUND_STATUS_UNSPECIFIED = 0;
  REFUND_STATUS_PENDING = 1;
  REFUND_STATUS_DONE = 2;
  REFUND_STATUS_FAILED = 3;
}

enum ReconciliationStatus {
  RECONCILIATION_STATUS_UNSPECIFIED = 0;
  RECONCILIATION_STATUS_MATCHED = 1;
  RECONCILIATION_STATUS_MISSING_LOCAL = 2;
  RECONCILIATION_STATUS_MISSING_PROVIDER = 3;
  RECONCILIATION_STATUS_AMOUNT_MISMATCH = 4;
}

enum ReconciliationAction {
  RECONCILIATION_ACTION_UNSPECIFIED = 0;
  RECONCILIATION_ACTION_ASSIGN = 1;
  RECONCILIATION_ACTION_REFUND = 2;
  RECONCILIATION_ACTION_SUSPEND = 3;
}

// Per-sub-order financial allocation.
// subtotal_vnd is seller merchandise revenue after seller-borne discounts (flash sale + shop voucher; R in plan.md).
// platform_discount_vnd is platform-borne discount for this sub-order (platform voucher + freeship + coins; D in plan.md).
// Payment.amount_vnd equals sum(subtotal_vnd + shipping_fee_vnd - platform_discount_vnd).
message ShopAllocation {
  string order_id = 1;
  string shop_id = 2;
  int64 subtotal_vnd = 3;
  int64 commission_vnd = 4;
  int64 shipping_fee_vnd = 5;
  int64 platform_discount_vnd = 6;
}

message Payment {
  string payment_id = 1;
  string order_group_id = 2;
  string order_id = 3;
  string user_id = 4;
  int64 amount_vnd = 5;
  PaymentMethod method = 6;
  PaymentStatus status = 7;
  string qr_url = 8;
  string qr_code = 9;
  string provider = 10;
  string provider_ref = 11;
  repeated ShopAllocation shop_allocations = 12;
  google.protobuf.Timestamp expires_at = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message Refund {
  string refund_id = 1;
  string payment_id = 2;
  string order_id = 3;
  int64 amount_vnd = 4;
  RefundStatus status = 5;
  string reason = 6;
  string idempotency_key = 7;
  google.protobuf.Timestamp created_at = 8;
  string bank_code = 9;
  string bank_account_masked = 10;
  string bank_account_name = 11;
  // Populated only for admin/super_admin callers; always empty for buyers.
  string bank_account_number = 12;
  string provider_refund_id = 13;
  bool is_late_payment = 14;
  google.protobuf.Timestamp settled_at = 15;
  string settlement_note = 16;
}

message AccountBalance {
  string account_code = 1;
  string account_type = 2;
  int64 debit_total_vnd = 3;
  int64 credit_total_vnd = 4;
  int64 balance_vnd = 5;
}

message ReconciliationItem {
  string payment_id = 1;
  string provider_tx_id = 2;
  int64 local_amount_vnd = 3;
  int64 provider_amount_vnd = 4;
  ReconciliationStatus status = 5;
  string note = 6;
}

message ReconciliationQueueItem {
  string id = 1;
  string webhook_event_id = 2;
  string provider = 3;
  string provider_tx_id = 4;
  string expected_payment_id = 5;
  string order_ref = 6;
  int64 expected_amount_vnd = 7;
  int64 actual_amount_vnd = 8;
  string reason = 9;
  string resolution_status = 10;
  string notes = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp resolved_at = 13;
}

message CreatePaymentRequest {
  string order_group_id = 1;
  string order_id = 2;
  string user_id = 3;
  int64 amount_vnd = 4;
  PaymentMethod method = 5;
  repeated ShopAllocation shop_allocations = 6;
  google.protobuf.Timestamp expires_at = 7;
  string idempotency_key = 8;
  bool supersede_previous = 9;
}

message CreatePaymentResponse {
  Payment payment = 1;
}

message GetPaymentRequest {
  string payment_id = 1;
  string order_group_id = 2;
  string order_id = 3;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message CancelPaymentRequest {
  string payment_id = 1;
  string order_group_id = 2;
  string reason = 3;
}

message CancelPaymentResponse {
  Payment payment = 1;
}

message CreateRefundRequest {
  string payment_id = 1;
  string order_id = 2;
  int64 amount_vnd = 3;
  string reason = 4;
  string idempotency_key = 5;
}

message CreateRefundResponse {
  Refund refund = 1;
  bool already_existed = 2;
}

message GetLedgerSummaryRequest {}

message GetLedgerSummaryResponse {
  int64 total_debits_vnd = 1;
  int64 total_credits_vnd = 2;
  bool is_balanced = 3;
  repeated AccountBalance accounts = 4;
}

message GetSellerBalanceRequest {
  string shop_id = 1;
}

message GetSellerBalanceResponse {
  string shop_id = 1;
  int64 pending_vnd = 2;
  int64 available_vnd = 3;
  int64 total_earned_vnd = 4;
}

message ReleaseEscrowRequest {
  string order_id = 1;
  string shop_id = 2;
}

message ReleaseEscrowResponse {
  bool released = 1;
  int64 released_amount_vnd = 2;
  bool already_released = 3;
}

message RunReconciliationRequest {
  string date = 1;
}

message RunReconciliationResponse {
  string run_id = 1;
  int32 matched_count = 2;
  int32 missing_local_count = 3;
  int32 missing_provider_count = 4;
  int32 amount_mismatch_count = 5;
  repeated ReconciliationItem items = 6;
}

message ListRefundsRequest {
  RefundStatus status = 1;
  string order_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListRefundsResponse {
  repeated Refund refunds = 1;
  int64 total = 2;
}

message SubmitRefundBankAccountRequest {
  string refund_id = 1;
  string bank_code = 2;
  string bank_account_number = 3;
  string bank_account_name = 4;
}

message SubmitRefundBankAccountResponse {
  Refund refund = 1;
}

message SettleRefundRequest {
  string refund_id = 1;
  string provider_refund_id = 2;
  string note = 3;
  string idempotency_key = 4;
}

message SettleRefundResponse {
  Refund refund = 1;
  bool already_settled = 2;
}

message ListReconciliationQueueRequest {
  string status = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListReconciliationQueueResponse {
  repeated ReconciliationQueueItem items = 1;
  int64 total = 2;
}

message ResolveReconciliationItemRequest {
  string item_id = 1;
  ReconciliationAction action = 2;
  string payment_id = 3;
  string note = 4;
  string idempotency_key = 5;
}

message ResolveReconciliationItemResponse {
  ReconciliationQueueItem item = 1;
  Refund refund = 2;
  bool already_resolved = 3;
}

service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc CancelPayment(CancelPaymentRequest) returns (CancelPaymentResponse);
  rpc CreateRefund(CreateRefundRequest) returns (CreateRefundResponse);
  rpc GetLedgerSummary(GetLedgerSummaryRequest) returns (GetLedgerSummaryResponse);
  rpc GetSellerBalance(GetSellerBalanceRequest) returns (GetSellerBalanceResponse);
  rpc ReleaseEscrow(ReleaseEscrowRequest) returns (ReleaseEscrowResponse);
  rpc RunReconciliation(RunReconciliationRequest) returns (RunReconciliationResponse);
  rpc ListRefunds(ListRefundsRequest) returns (ListRefundsResponse);
  rpc SubmitRefundBankAccount(SubmitRefundBankAccountRequest) returns (SubmitRefundBankAccountResponse);
  rpc SettleRefund(SettleRefundRequest) returns (SettleRefundResponse);
  rpc ListReconciliationQueue(ListReconciliationQueueRequest) returns (ListReconciliationQueueResponse);
  rpc ResolveReconciliationItem(ResolveReconciliationItemRequest) returns (ResolveReconciliationItemResponse);
}
