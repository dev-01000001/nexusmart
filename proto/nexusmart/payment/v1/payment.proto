syntax = "proto3";

package nexusmart.payment.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nexusmart/core/gen/go/nexusmart/payment/v1;paymentv1";

enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_COD = 1;
  PAYMENT_METHOD_VIETQR = 2;
  PAYMENT_METHOD_ZALOPAY = 3;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_SUCCEEDED = 2;
  PAYMENT_STATUS_FAILED = 3;
  PAYMENT_STATUS_EXPIRED = 4;
  PAYMENT_STATUS_CANCELLED = 5;
  PAYMENT_STATUS_REFUNDED = 6;
}

enum RefundStatus {
  REFUND_STATUS_UNSPECIFIED = 0;
  REFUND_STATUS_PENDING = 1;
  REFUND_STATUS_DONE = 2;
  REFUND_STATUS_FAILED = 3;
  REFUND_STATUS_PENDING_APPROVAL = 4;
  REFUND_STATUS_REJECTED = 5;
  REFUND_STATUS_MANUAL_REVIEW = 6;
}

enum ReconciliationStatus {
  RECONCILIATION_STATUS_UNSPECIFIED = 0;
  RECONCILIATION_STATUS_MATCHED = 1;
  RECONCILIATION_STATUS_MISSING_LOCAL = 2;
  RECONCILIATION_STATUS_MISSING_PROVIDER = 3;
  RECONCILIATION_STATUS_AMOUNT_MISMATCH = 4;
  RECONCILIATION_STATUS_ALREADY_RECONCILED = 5;
  RECONCILIATION_STATUS_NOT_DELIVERED = 6;
}

enum ReconciliationAction {
  RECONCILIATION_ACTION_UNSPECIFIED = 0;
  RECONCILIATION_ACTION_ASSIGN = 1;
  RECONCILIATION_ACTION_REFUND = 2;
  RECONCILIATION_ACTION_SUSPEND = 3;
}

// Per-sub-order financial allocation.
// subtotal_vnd is seller merchandise revenue after seller-borne discounts (flash sale + shop program + shop voucher + shop freeship; R in w2b-plan.md).
// commission_vnd is total seller-borne platform fees (category commission + payment fee; C_total <= R).
// platform_discount_vnd is platform-borne discount for this sub-order (platform voucher + platform freeship + coins; D in plan.md).
// Payment.amount_vnd equals sum(subtotal_vnd + shipping_fee_vnd - platform_discount_vnd).
message ShopAllocation {
  string order_id = 1;
  string shop_id = 2;
  int64 subtotal_vnd = 3;
  int64 commission_vnd = 4;
  int64 shipping_fee_vnd = 5;
  int64 platform_discount_vnd = 6;
  // Immutable sales channel: "MARKETPLACE" or "STOREFRONT".
  string sales_channel = 7;
  // Immutable storefront shop ID when sales_channel is "STOREFRONT"; empty otherwise.
  string storefront_shop_id = 8;
}

message Payment {
  string payment_id = 1;
  string order_group_id = 2;
  string order_id = 3;
  string user_id = 4;
  int64 amount_vnd = 5;
  PaymentMethod method = 6;
  PaymentStatus status = 7;
  string qr_url = 8;
  string qr_code = 9;
  string provider = 10;
  string provider_ref = 11;
  repeated ShopAllocation shop_allocations = 12;
  google.protobuf.Timestamp expires_at = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  // Redirect/deep-link URL for e-wallet payments (e.g. ZaloPay order_url; empty for COD/VietQR) (F1/F8).
  string pay_url = 16;
  string sales_channel = 17;
  string storefront_shop_id = 18;
}

message Refund {
  string refund_id = 1;
  string payment_id = 2;
  string order_id = 3;
  int64 amount_vnd = 4;
  RefundStatus status = 5;
  string reason = 6;
  string idempotency_key = 7;
  google.protobuf.Timestamp created_at = 8;
  string bank_code = 9;
  string bank_account_masked = 10;
  string bank_account_name = 11;
  // Populated only for admin/super_admin callers; always empty for buyers.
  string bank_account_number = 12;
  string provider_refund_id = 13;
  bool is_late_payment = 14;
  google.protobuf.Timestamp settled_at = 15;
  string settlement_note = 16;
  // Two-person approval metadata for large manual/return refunds (F11).
  string requested_by = 17;
  string approved_by = 18;
  google.protobuf.Timestamp approved_at = 19;
  string approval_note = 20;
  // E-wallet refund idempotency reference (e.g. ZaloPay m_refund_id) and provider status (F4).
  string provider_m_refund_id = 21;
  string provider_status = 22;
}

message AccountBalance {
  string account_code = 1;
  string account_type = 2;
  int64 debit_total_vnd = 3;
  int64 credit_total_vnd = 4;
  int64 balance_vnd = 5;
}

message ReconciliationItem {
  string payment_id = 1;
  string provider_tx_id = 2;
  int64 local_amount_vnd = 3;
  int64 provider_amount_vnd = 4;
  ReconciliationStatus status = 5;
  string note = 6;
  string tracking_code = 7;
  string order_id = 8;
  int32 line_number = 9;
  string sales_channel = 10;
  string storefront_shop_id = 11;
}

message ReconciliationQueueItem {
  string id = 1;
  string webhook_event_id = 2;
  string provider = 3;
  string provider_tx_id = 4;
  string expected_payment_id = 5;
  string order_ref = 6;
  int64 expected_amount_vnd = 7;
  int64 actual_amount_vnd = 8;
  string reason = 9;
  string resolution_status = 10;
  string notes = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp resolved_at = 13;
  // Origin of queue entry (e.g. "webhook", "reconciliation", "cod_file") (E20).
  string source_type = 14;
  string tracking_code = 15;
}

message CreatePaymentRequest {
  string order_group_id = 1;
  string order_id = 2;
  string user_id = 3;
  int64 amount_vnd = 4;
  PaymentMethod method = 5;
  repeated ShopAllocation shop_allocations = 6;
  google.protobuf.Timestamp expires_at = 7;
  string idempotency_key = 8;
  bool supersede_previous = 9;
  // Optional sales channel: "" (defaults to "MARKETPLACE"), "MARKETPLACE", or "STOREFRONT".
  string sales_channel = 10;
  // Required matching shop ID when sales_channel is "STOREFRONT"; empty for "MARKETPLACE".
  string storefront_shop_id = 11;
}

message CreatePaymentResponse {
  Payment payment = 1;
}

message GetPaymentRequest {
  string payment_id = 1;
  string order_group_id = 2;
  string order_id = 3;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message CancelPaymentRequest {
  string payment_id = 1;
  string order_group_id = 2;
  string reason = 3;
}

message CancelPaymentResponse {
  Payment payment = 1;
}

message CreateRefundRequest {
  string payment_id = 1;
  string order_id = 2;
  int64 amount_vnd = 3;
  string reason = 4;
  string idempotency_key = 5;
  // Set true on service-token return refunds triggered by AdminResolveReturn so F11 large-refund
  // two-person approval applies (automatic saga cancel/failed-delivery refunds leave this false).
  // End-user admin JWT calls always enforce the large-refund approval threshold regardless of this flag.
  bool require_approval_if_large = 6;
  // Honoured only on service-token calls with require_approval_if_large=true to record the maker user ID
  // for maker!=checker enforcement (ignored on end-user JWT calls where claims.sub is authoritative).
  string requested_by = 7;
}

message CreateRefundResponse {
  Refund refund = 1;
  bool already_existed = 2;
}

message GetLedgerSummaryRequest {
  // Optional sales channel filter: "" (all channels), "MARKETPLACE", or "STOREFRONT".
  string sales_channel = 1;
}

message GetLedgerSummaryResponse {
  int64 total_debits_vnd = 1;
  int64 total_credits_vnd = 2;
  bool is_balanced = 3;
  repeated AccountBalance accounts = 4;
  // Applied sales channel filter: "" (all), "MARKETPLACE", or "STOREFRONT".
  string sales_channel = 5;
}

message GetSellerBalanceRequest {
  string shop_id = 1;
}

message GetSellerBalanceResponse {
  string shop_id = 1;
  int64 pending_vnd = 2;
  int64 available_vnd = 3;
  int64 total_earned_vnd = 4;
  int64 payout_pending_vnd = 5;
}

message ReleaseEscrowRequest {
  string order_id = 1;
  string shop_id = 2;
}

message ReleaseEscrowResponse {
  bool released = 1;
  int64 released_amount_vnd = 2;
  bool already_released = 3;
}

message RunReconciliationRequest {
  string date = 1;
  // Optional sales channel filter: "" (all channels), "MARKETPLACE", or "STOREFRONT".
  string sales_channel = 2;
}

message RunReconciliationResponse {
  string run_id = 1;
  int32 matched_count = 2;
  int32 missing_local_count = 3;
  int32 missing_provider_count = 4;
  int32 amount_mismatch_count = 5;
  repeated ReconciliationItem items = 6;
  // Applied sales channel filter: "" (all), "MARKETPLACE", or "STOREFRONT".
  string sales_channel = 7;
  int32 auto_healed_count = 8;
}

message ReconciliationReportSummary {
  string run_id = 1;
  string provider = 2;
  string run_date = 3;
  string sales_channel = 4;
  int32 matched_count = 5;
  int32 missing_local_count = 6;
  int32 missing_provider_count = 7;
  int32 amount_mismatch_count = 8;
  int32 auto_healed_count = 9;
  string status = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp completed_at = 12;
}

message ListReconciliationReportsRequest {
  int32 limit = 1;
  string sales_channel = 2;
}

message ListReconciliationReportsResponse {
  repeated ReconciliationReportSummary reports = 1;
}

message ListRefundsRequest {
  RefundStatus status = 1;
  string order_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListRefundsResponse {
  repeated Refund refunds = 1;
  int64 total = 2;
}

message SubmitRefundBankAccountRequest {
  string refund_id = 1;
  string bank_code = 2;
  string bank_account_number = 3;
  string bank_account_name = 4;
}

message SubmitRefundBankAccountResponse {
  Refund refund = 1;
}

message SettleRefundRequest {
  string refund_id = 1;
  string provider_refund_id = 2;
  string note = 3;
  string idempotency_key = 4;
}

message SettleRefundResponse {
  Refund refund = 1;
  bool already_settled = 2;
}

message ListReconciliationQueueRequest {
  string status = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListReconciliationQueueResponse {
  repeated ReconciliationQueueItem items = 1;
  int64 total = 2;
}

message ResolveReconciliationItemRequest {
  string item_id = 1;
  ReconciliationAction action = 2;
  string payment_id = 3;
  string note = 4;
  string idempotency_key = 5;
}

message ResolveReconciliationItemResponse {
  ReconciliationQueueItem item = 1;
  Refund refund = 2;
  bool already_resolved = 3;
}

message PaymentFeeConfigItem {
  string id = 1;
  PaymentMethod payment_method = 2;
  int32 fee_bps = 3;
  google.protobuf.Timestamp effective_from = 4;
  string created_by = 5;
  string note = 6;
  google.protobuf.Timestamp created_at = 7;
}

message GetFeeConfigRequest {
  // Optional: filter to a specific payment method; UNSPECIFIED returns all methods.
  PaymentMethod payment_method = 1;
  // When true (admin only), also populates history with past and scheduled future entries.
  bool include_history = 2;
  // Optional reference time for resolving active rates (defaults to now).
  google.protobuf.Timestamp at_time = 3;
}

message GetFeeConfigResponse {
  // Currently effective fee config entry per payment method (at_time or now).
  repeated PaymentFeeConfigItem active_configs = 1;
  // Full history + scheduled future entries (ordered by effective_from DESC) when include_history = true.
  repeated PaymentFeeConfigItem history = 2;
}

message SetFeeConfigRequest {
  PaymentMethod payment_method = 1;
  int32 fee_bps = 2;
  // Empty/nil defaults to now (effective immediately).
  google.protobuf.Timestamp effective_from = 3;
  string note = 4;
}

message SetFeeConfigResponse {
  PaymentFeeConfigItem config = 1;
}

message SellerLedgerEntry {
  string id = 1;
  string transaction_id = 2;
  string account_code = 3;
  string reference_type = 4;
  string reference_id = 5;
  string description = 6;
  int64 debit_vnd = 7;
  int64 credit_vnd = 8;
  // Signed change for this seller liability account: credit_vnd - debit_vnd.
  int64 delta_vnd = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListSellerLedgerRequest {
  // Optional for seller (always overridden by verified JWT shop_id); admin may specify shop_id.
  string shop_id = 1;
  // Optional filter: "pending" | "available" | "" (all shop accounts).
  string account_filter = 2;
  // Optional filter by ledger transaction reference_type.
  string reference_type = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListSellerLedgerResponse {
  repeated SellerLedgerEntry entries = 1;
  int64 total = 2;
}

message CodReconciliationRow {
  int32 line_number = 1;
  string tracking_code = 2;
  int64 cod_amount_vnd = 3;
  string delivered_at = 4;
  // Optional fallback used ONLY when the COD allocation does not yet store tracking_code (E20).
  string order_code = 5;
}

message ReconciliationRunSummary {
  string run_id = 1;
  string run_type = 2;
  string provider = 3;
  string run_date = 4;
  string file_name = 5;
  int32 total_rows = 6;
  int32 matched_count = 7;
  int32 already_reconciled_count = 8;
  int32 missing_local_count = 9;
  int32 missing_provider_count = 10;
  int32 amount_mismatch_count = 11;
  int64 total_matched_vnd = 12;
  string status = 13;
  string created_by = 14;
  google.protobuf.Timestamp created_at = 15;
  int32 not_delivered_count = 16;
  string sales_channel = 17;
  int32 auto_healed_count = 18;
  google.protobuf.Timestamp completed_at = 19;
}

message ImportCodReconciliationRequest {
  string carrier_code = 1;
  string file_name = 2;
  string file_sha256 = 3;
  repeated CodReconciliationRow rows = 4;
  string run_date = 5;
}

message ImportCodReconciliationResponse {
  ReconciliationRunSummary run = 1;
  repeated ReconciliationItem items = 2;
}

message ListReconciliationRunsRequest {
  string run_type = 1;
  int32 page = 2;
  int32 page_size = 3;
  string sales_channel = 4;
}

message ListReconciliationRunsResponse {
  repeated ReconciliationRunSummary runs = 1;
  int64 total = 2;
}

message PaymentMethodConfig {
  PaymentMethod method = 1;
  bool enabled = 2;
  int64 min_order_vnd = 3;
  // 0 means no upper limit.
  int64 max_order_vnd = 4;
  // Payment expiry in minutes (0 for COD).
  int32 expiry_minutes = 5;
  // Populated only for callers with payment_methods.read capability; false/empty on public responses.
  bool credentials_configured = 6;
  string credential_preview = 7;
  string updated_by = 8;
  google.protobuf.Timestamp updated_at = 9;
  string note = 10;
  // Monotonic optimistic locking version (F7).
  int64 version = 11;
}

message GetPaymentMethodConfigsRequest {
  // Optional filter; PAYMENT_METHOD_UNSPECIFIED returns all configured methods.
  PaymentMethod method = 1;
}

message GetPaymentMethodConfigsResponse {
  repeated PaymentMethodConfig configs = 1;
}

message UpdatePaymentMethodConfigRequest {
  PaymentMethod method = 1;
  bool enabled = 2;
  int64 min_order_vnd = 3;
  int64 max_order_vnd = 4;
  int32 expiry_minutes = 5;
  string note = 6;
  // Required optimistic locking version (F7); version mismatch returns FailedPrecondition (409).
  int64 expected_version = 7;
}

message UpdatePaymentMethodConfigResponse {
  PaymentMethodConfig config = 1;
}

message DecideRefundApprovalRequest {
  string refund_id = 1;
  bool approve = 2;
  string note = 3;
}

message DecideRefundApprovalResponse {
  Refund refund = 1;
}

// Adjusts the shipping fee (increase or decrease) on a single sub-order's uncollected COD allocation
// (escrow_status = awaiting_collection, payment status = pending, method = COD).
// Restricted strictly to order-service token; prepaid surcharges are explicitly out of scope (G2).
message AdjustCODShippingFeeRequest {
  string order_id = 1;
  int64 new_shipping_fee_vnd = 2;
  string idempotency_key = 3;
}

message AdjustCODShippingFeeResponse {
  Payment payment = 1;
  int64 old_shipping_fee_vnd = 2;
  int64 new_shipping_fee_vnd = 3;
  int64 new_order_payable_vnd = 4;
  bool already_applied = 5;
}

message SellerPayout {
  string id = 1;
  string shop_id = 2;
  int64 amount_vnd = 3;
  // "PENDING" | "COMPLETED" | "REJECTED"
  string status = 4;
  string bank_name = 5;
  string bank_account_masked = 6;
  string account_holder_name = 7;
  string reject_reason = 8;
  string transfer_ref = 9;
  string requested_by = 10;
  string decided_by = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp decided_at = 13;
}

message RequestSellerPayoutRequest {
  string shop_id = 1;
  int64 amount_vnd = 2;
  string idempotency_key = 3;
  string requested_by_user_id = 4;
}

message RequestSellerPayoutResponse {
  SellerPayout payout = 1;
}

message ListSellerPayoutsRequest {
  // Optional for admin (empty lists all shops); for seller must equal JWT shop_id.
  string shop_id = 1;
  // Optional filter: "" | "PENDING" | "COMPLETED" | "REJECTED".
  string status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListSellerPayoutsResponse {
  repeated SellerPayout items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 total = 4;
}

message DecideSellerPayoutRequest {
  string payout_id = 1;
  // "APPROVE" | "REJECT"
  string decision = 2;
  string reason = 3;
  string decided_by_user_id = 4;
}

message DecideSellerPayoutResponse {
  SellerPayout payout = 1;
}

service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc CancelPayment(CancelPaymentRequest) returns (CancelPaymentResponse);
  rpc CreateRefund(CreateRefundRequest) returns (CreateRefundResponse);
  rpc GetLedgerSummary(GetLedgerSummaryRequest) returns (GetLedgerSummaryResponse);
  rpc GetSellerBalance(GetSellerBalanceRequest) returns (GetSellerBalanceResponse);
  rpc ReleaseEscrow(ReleaseEscrowRequest) returns (ReleaseEscrowResponse);
  rpc RunReconciliation(RunReconciliationRequest) returns (RunReconciliationResponse);
  rpc ListRefunds(ListRefundsRequest) returns (ListRefundsResponse);
  rpc SubmitRefundBankAccount(SubmitRefundBankAccountRequest) returns (SubmitRefundBankAccountResponse);
  rpc SettleRefund(SettleRefundRequest) returns (SettleRefundResponse);
  rpc ListReconciliationQueue(ListReconciliationQueueRequest) returns (ListReconciliationQueueResponse);
  rpc ResolveReconciliationItem(ResolveReconciliationItemRequest) returns (ResolveReconciliationItemResponse);
  rpc GetFeeConfig(GetFeeConfigRequest) returns (GetFeeConfigResponse);
  rpc SetFeeConfig(SetFeeConfigRequest) returns (SetFeeConfigResponse);
  rpc ListSellerLedger(ListSellerLedgerRequest) returns (ListSellerLedgerResponse);
  rpc ImportCodReconciliation(ImportCodReconciliationRequest) returns (ImportCodReconciliationResponse);
  rpc ListReconciliationRuns(ListReconciliationRunsRequest) returns (ListReconciliationRunsResponse);
  rpc ListReconciliationReports(ListReconciliationReportsRequest) returns (ListReconciliationReportsResponse);
  rpc GetPaymentMethodConfigs(GetPaymentMethodConfigsRequest) returns (GetPaymentMethodConfigsResponse);
  rpc UpdatePaymentMethodConfig(UpdatePaymentMethodConfigRequest) returns (UpdatePaymentMethodConfigResponse);
  rpc DecideRefundApproval(DecideRefundApprovalRequest) returns (DecideRefundApprovalResponse);
  rpc AdjustCODShippingFee(AdjustCODShippingFeeRequest) returns (AdjustCODShippingFeeResponse);
  rpc RequestSellerPayout(RequestSellerPayoutRequest) returns (RequestSellerPayoutResponse);
  rpc ListSellerPayouts(ListSellerPayoutsRequest) returns (ListSellerPayoutsResponse);
  rpc DecideSellerPayout(DecideSellerPayoutRequest) returns (DecideSellerPayoutResponse);
}
