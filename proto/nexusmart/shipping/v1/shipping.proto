syntax = "proto3";

package nexusmart.shipping.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nexusmart/core/gen/go/nexusmart/shipping/v1;shippingv1";

enum ShipmentStatus {
  SHIPMENT_STATUS_UNSPECIFIED = 0;
  SHIPMENT_STATUS_CREATED = 1;
  SHIPMENT_STATUS_PICKING = 2;
  SHIPMENT_STATUS_DELIVERING = 3;
  SHIPMENT_STATUS_DELIVERED = 4;
  SHIPMENT_STATUS_FAILED = 5;
  SHIPMENT_STATUS_RETURNING = 6;
  SHIPMENT_STATUS_RETURNED = 7;
  SHIPMENT_STATUS_CANCELLED = 8;
  SHIPMENT_STATUS_QUEUED = 9;
}

enum ShipmentDirection {
  SHIPMENT_DIRECTION_UNSPECIFIED = 0;
  SHIPMENT_DIRECTION_FORWARD = 1;
  SHIPMENT_DIRECTION_RETURN = 2;
}

enum ShippingRegion {
  SHIPPING_REGION_UNSPECIFIED = 0;
  SHIPPING_REGION_SAME_PROVINCE = 1;
  SHIPPING_REGION_SAME_REGION = 2;
  SHIPPING_REGION_CROSS_REGION = 3;
}

message Province {
  string code = 1;
  string name = 2;
}

message Ward {
  string code = 1;
  string province_code = 2;
  string name = 3;
  // True by default; false for islands/areas where COD is unsupported (e.g. Hoang Sa, Truong Sa) (E16).
  bool cod_supported = 4;
}

message CarrierQuote {
  string carrier_code = 1;
  string carrier_name = 2;
  string service_code = 3;
  string service_name = 4;
  int64 fee_vnd = 5;
  int32 estimated_days = 6;
  bool is_fallback = 7;
  bool cod_supported = 8;
}

message ShipmentAddress {
  string name = 1;
  string phone = 2;
  string province_code = 3;
  string ward_code = 4;
  string street_address = 5;
}

message Shipment {
  string shipment_id = 1;
  string order_id = 2;
  string shop_id = 3;
  string carrier_code = 4;
  string service_code = 5;
  string tracking_code = 6;
  string label_url = 7;
  ShipmentStatus status = 8;
  int64 fee_vnd = 9;
  int64 cod_amount_vnd = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  ShipmentDirection direction = 13;
  string return_request_id = 14;
  int32 redelivery_count = 15;
}

message FallbackRate {
  ShippingRegion region = 1;
  int64 base_fee_vnd = 2;
  int32 base_weight_grams = 3;
  int64 extra_fee_vnd_per_500g = 4;
}

message CarrierConfig {
  string carrier_code = 1;
  string name = 2;
  bool enabled = 3;
  bool token_configured = 4;
  repeated FallbackRate fallback_rates = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ShopShippingSettings {
  string shop_id = 1;
  repeated string enabled_carrier_codes = 2;
  int32 default_weight_grams = 3;
  int32 default_length_cm = 4;
  int32 default_width_cm = 5;
  int32 default_height_cm = 6;
  google.protobuf.Timestamp updated_at = 7;
  bool free_ship_enabled = 8;
  int64 free_ship_min_order_vnd = 9;
  int64 free_ship_max_vnd = 10;
}

message ShipmentEvent {
  string id = 1;
  string shipment_id = 2;
  ShipmentStatus status = 3;
  string raw_status = 4;
  string description = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

message ListProvincesRequest {
  string query = 1;
}

message ListProvincesResponse {
  repeated Province provinces = 1;
}

message ListWardsRequest {
  string province_code = 1;
  string query = 2;
}

message ListWardsResponse {
  repeated Ward wards = 1;
}

message MapLegacyAddressRequest {
  string legacy_province = 1;
  string legacy_district = 2;
  string legacy_ward = 3;
}

message MapLegacyAddressResponse {
  bool found = 1;
  string province_code = 2;
  string province_name = 3;
  string ward_code = 4;
  string ward_name = 5;
  string legacy_province_code = 6;
  string legacy_district_code = 7;
  string legacy_ward_code = 8;
}

message CalculateFeeRequest {
  string shop_id = 1;
  string from_province_code = 2;
  string from_ward_code = 3;
  string to_province_code = 4;
  string to_ward_code = 5;
  int32 weight_grams = 6;
  int64 cod_amount_vnd = 7;
  // Quantity of items whose SKU lacked explicit weight_grams (>0) so shipping adds shop default_weight_grams * qty internally (E17).
  int32 fallback_weight_item_qty = 8;
}

message CalculateFeeResponse {
  repeated CarrierQuote quotes = 1;
  // True when to_ward_code was omitted and shipping quoted using a representative ward of to_province_code (E17).
  bool is_estimated = 2;
}

message CreateShipmentRequest {
  string order_id = 1;
  string shop_id = 2;
  string carrier_code = 3;
  string service_code = 4;
  int64 cod_amount_vnd = 5;
  int32 weight_grams = 6;
  ShipmentAddress from_address = 7;
  ShipmentAddress to_address = 8;
  string items_summary = 9;
  // Populated by order service from the order record; shipping never trusts buyer_id from end-user clients
  // and stores it so RequestRedelivery can verify buyer ownership. Not returned on Shipment.
  string buyer_id = 10;
  // When true (UC-S15 batch ship, G4), validate non-retryable preconditions and enqueue directly into
  // shipment_create_jobs without calling the carrier synchronously (returns queued=true, job_id).
  bool enqueue_only = 11;
}

message CreateShipmentResponse {
  Shipment shipment = 1;
  bool already_existed = 2;
  // True when carrier failed transiently (5xx/timeout/circuit-open) and a retry job was persisted (E18).
  bool queued = 3;
  string job_id = 4;
}

message CancelShipmentRequest {
  string order_id = 1;
  string reason = 2;
  // SHIPMENT_DIRECTION_UNSPECIFIED defaults to SHIPMENT_DIRECTION_FORWARD.
  ShipmentDirection direction = 3;
}

message CancelShipmentResponse {
  Shipment shipment = 1;
}

message GetShipmentRequest {
  string order_id = 1;
  string tracking_code = 2;
  // SHIPMENT_DIRECTION_UNSPECIFIED defaults to SHIPMENT_DIRECTION_FORWARD.
  ShipmentDirection direction = 3;
}

message GetShipmentResponse {
  Shipment shipment = 1;
  repeated ShipmentEvent events = 2;
}

message CreateReturnShipmentRequest {
  string order_id = 1;
  string return_request_id = 2;
  string shop_id = 3;
  // Buyer pickup address.
  ShipmentAddress from_address = 4;
  // Shop warehouse return address.
  ShipmentAddress to_address = 5;
  int32 weight_grams = 6;
  string carrier_code = 7;
  string service_code = 8;
  string items_summary = 9;
  // Populated by order service from the order record; shipping never trusts buyer_id from end-user clients.
  // Not returned on Shipment.
  string buyer_id = 10;
}

message CreateReturnShipmentResponse {
  Shipment shipment = 1;
  bool already_existed = 2;
}

message RequestRedeliveryRequest {
  string order_id = 1;
  // Preferred redelivery date (YYYY-MM-DD, optional).
  string preferred_date = 2;
  string note = 3;
}

message RequestRedeliveryResponse {
  Shipment shipment = 1;
}

message GetShopShippingSettingsRequest {
  string shop_id = 1;
}

message GetShopShippingSettingsResponse {
  ShopShippingSettings settings = 1;
}

message UpdateShopShippingSettingsRequest {
  string shop_id = 1;
  repeated string enabled_carrier_codes = 2;
  int32 default_weight_grams = 3;
  int32 default_length_cm = 4;
  int32 default_width_cm = 5;
  int32 default_height_cm = 6;
  bool free_ship_enabled = 7;
  int64 free_ship_min_order_vnd = 8;
  int64 free_ship_max_vnd = 9;
}

message UpdateShopShippingSettingsResponse {
  ShopShippingSettings settings = 1;
}

message AdminListCarriersRequest {}

message AdminListCarriersResponse {
  repeated CarrierConfig carriers = 1;
}

message AdminUpdateCarrierRequest {
  string carrier_code = 1;
  bool enabled = 2;
  // Write-only carrier API token (encrypted at rest; empty preserves existing token).
  string api_token = 3;
  repeated FallbackRate fallback_rates = 4;
}

message AdminUpdateCarrierResponse {
  CarrierConfig carrier = 1;
}

message AdminTestCarrierRequest {
  string carrier_code = 1;
}

message AdminTestCarrierResponse {
  bool ok = 1;
  string message = 2;
}

service ShippingService {
  rpc ListProvinces(ListProvincesRequest) returns (ListProvincesResponse);
  rpc ListWards(ListWardsRequest) returns (ListWardsResponse);
  rpc MapLegacyAddress(MapLegacyAddressRequest) returns (MapLegacyAddressResponse);
  rpc CalculateFee(CalculateFeeRequest) returns (CalculateFeeResponse);
  rpc CreateShipment(CreateShipmentRequest) returns (CreateShipmentResponse);
  rpc CancelShipment(CancelShipmentRequest) returns (CancelShipmentResponse);
  rpc GetShipment(GetShipmentRequest) returns (GetShipmentResponse);
  rpc CreateReturnShipment(CreateReturnShipmentRequest) returns (CreateReturnShipmentResponse);
  rpc RequestRedelivery(RequestRedeliveryRequest) returns (RequestRedeliveryResponse);
  rpc GetShopShippingSettings(GetShopShippingSettingsRequest) returns (GetShopShippingSettingsResponse);
  rpc UpdateShopShippingSettings(UpdateShopShippingSettingsRequest) returns (UpdateShopShippingSettingsResponse);
  rpc AdminListCarriers(AdminListCarriersRequest) returns (AdminListCarriersResponse);
  rpc AdminUpdateCarrier(AdminUpdateCarrierRequest) returns (AdminUpdateCarrierResponse);
  rpc AdminTestCarrier(AdminTestCarrierRequest) returns (AdminTestCarrierResponse);
}
