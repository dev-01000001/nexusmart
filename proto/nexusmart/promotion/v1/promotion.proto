syntax = "proto3";

package nexusmart.promotion.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nexusmart/core/gen/go/nexusmart/promotion/v1;promotionv1";

enum VoucherScope {
  VOUCHER_SCOPE_UNSPECIFIED = 0;
  VOUCHER_SCOPE_PLATFORM = 1;
  VOUCHER_SCOPE_SHOP = 2;
  VOUCHER_SCOPE_FREESHIP = 3;
}

enum DiscountType {
  DISCOUNT_TYPE_UNSPECIFIED = 0;
  DISCOUNT_TYPE_FIXED = 1;
  DISCOUNT_TYPE_PERCENT = 2;
}

enum FlashSaleItemStatus {
  FLASH_SALE_ITEM_STATUS_UNSPECIFIED = 0;
  FLASH_SALE_ITEM_STATUS_PENDING = 1;
  FLASH_SALE_ITEM_STATUS_APPROVED = 2;
  FLASH_SALE_ITEM_STATUS_REJECTED = 3;
}

enum VoucherStatus {
  VOUCHER_STATUS_UNSPECIFIED = 0;
  VOUCHER_STATUS_ACTIVE = 1;
  VOUCHER_STATUS_PAUSED = 2;
  VOUCHER_STATUS_DELETED = 3;
}

enum ShopDiscountProgramStatus {
  SHOP_DISCOUNT_PROGRAM_STATUS_UNSPECIFIED = 0;
  SHOP_DISCOUNT_PROGRAM_STATUS_SCHEDULED = 1;
  SHOP_DISCOUNT_PROGRAM_STATUS_ACTIVE = 2;
  SHOP_DISCOUNT_PROGRAM_STATUS_ENDED = 3;
}

message Voucher {
  string id = 1;
  string code = 2;
  string name = 3;
  VoucherScope scope = 4;
  string shop_id = 5;
  DiscountType discount_type = 6;
  int64 value_vnd = 7;
  int32 discount_percent = 8;
  int64 max_discount_vnd = 9;
  int64 min_order_vnd = 10;
  int32 quota = 11;
  int32 used_count = 12;
  int32 remaining_quota = 13;
  int32 per_user_limit = 14;
  int64 budget_vnd = 15;
  int64 used_budget_vnd = 16;
  google.protobuf.Timestamp starts_at = 17;
  google.protobuf.Timestamp ends_at = 18;
  bool is_active = 19;
  bool saved = 20;
  bool eligible = 21;
  string ineligible_reason = 22;
  VoucherStatus status = 23;
  // Optional platform voucher category restriction (evaluated across all descendant categories).
  repeated string category_ids = 24;
}

message FlashSaleItem {
  string id = 1;
  string flash_sale_id = 2;
  string shop_id = 3;
  string sku_id = 4;
  int64 flash_price_vnd = 5;
  int32 total_slots = 6;
  int32 remaining_slots = 7;
  int32 per_user_limit = 8;
  FlashSaleItemStatus status = 9;
  string rejection_reason = 10;
  int64 original_price_vnd = 11;
  google.protobuf.Timestamp created_at = 12;
}

message FlashSale {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
  repeated FlashSaleItem items = 5;
  int32 min_discount_percent = 6;
  repeated string category_ids = 7;
  string status = 8;
}

message ShopDiscountProgramItemInput {
  string sku_id = 1;
  // Exactly one of discounted_price_vnd (> 0) or discount_percent (1..99) is specified.
  int64 discounted_price_vnd = 2;
  int32 discount_percent = 3;
  int32 per_user_limit = 4;
}

message ShopDiscountProgramItem {
  string id = 1;
  string program_id = 2;
  string shop_id = 3;
  string sku_id = 4;
  int64 original_price_vnd = 5;
  int64 discounted_price_vnd = 6;
  int32 discount_percent = 7;
  int32 per_user_limit = 8;
  bool price_inflation_flagged = 9;
  string warning = 10;
}

message ShopDiscountProgram {
  string id = 1;
  string shop_id = 2;
  string name = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
  ShopDiscountProgramStatus status = 6;
  repeated ShopDiscountProgramItem items = 7;
  repeated string warnings = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message ActiveShopDiscount {
  string item_id = 1;
  string program_id = 2;
  string shop_id = 3;
  string sku_id = 4;
  int64 original_price_vnd = 5;
  int64 discounted_price_vnd = 6;
  int32 discount_percent = 7;
  int32 per_user_limit = 8;
  google.protobuf.Timestamp starts_at = 9;
  google.protobuf.Timestamp ends_at = 10;
}

message CoinTransaction {
  string id = 1;
  string user_id = 2;
  int64 delta = 3;
  string reason = 4;
  string reference_id = 5;
  google.protobuf.Timestamp created_at = 6;
}

message DiscountLineItem {
  string sku_id = 1;
  int32 quantity = 2;
  // Ignored by PreviewDiscounts (D4): promotion resolves authoritative SKU price via ProductService.GetSKUsBatch.
  int64 unit_price_vnd = 3;
  string flash_sale_item_id = 4;
  // Ignored by PreviewDiscounts (D4): promotion resolves authoritative SKU category_id via ProductService.GetSKUsBatch.
  string category_id = 5;
  string shop_discount_program_item_id = 6;
}

message ShopDiscountInput {
  string shop_id = 1;
  // Ignored by PreviewDiscounts (D4): promotion computes subtotal_vnd from authoritative SKU prices resolved via ProductService.GetSKUsBatch.
  int64 subtotal_vnd = 2;
  int64 shipping_fee_vnd = 3;
  repeated DiscountLineItem items = 4;
  bool free_ship_enabled = 5;
  int64 free_ship_min_order_vnd = 6;
  int64 free_ship_max_vnd = 7;
}

message ShopDiscountBreakdown {
  string shop_id = 1;
  int64 subtotal_vnd = 2;
  int64 flash_sale_discount_vnd = 3;
  string shop_voucher_id = 4;
  int64 shop_voucher_discount_vnd = 5;
  int64 platform_voucher_discount_vnd = 6;
  int64 freeship_discount_vnd = 7;
  int64 coins_discount_vnd = 8;
  int64 shipping_fee_vnd = 9;
  int64 final_shipping_fee_vnd = 10;
  int64 final_payable_vnd = 11;
  int64 shop_program_discount_vnd = 12;
  int64 shop_freeship_discount_vnd = 13;
  // shop_discount_program_item_id values actually applied for this shop; lines exceeding per_user_limit are excluded and billed at regular price.
  repeated string applied_shop_program_item_ids = 14;
}

message DiscountBreakdown {
  repeated ShopDiscountBreakdown shops = 1;
  int64 total_subtotal_vnd = 2;
  int64 total_flash_sale_discount_vnd = 3;
  int64 total_shop_voucher_discount_vnd = 4;
  int64 total_platform_voucher_discount_vnd = 5;
  int64 total_freeship_discount_vnd = 6;
  int64 total_coins_discount_vnd = 7;
  int64 total_discount_vnd = 8;
  int64 platform_cost_vnd = 9;
  int64 shop_cost_vnd = 10;
  int64 total_shipping_fee_vnd = 11;
  int64 final_payable_vnd = 12;
  repeated string warnings = 13;
  int64 total_shop_program_discount_vnd = 14;
  int64 total_shop_freeship_discount_vnd = 15;
}

message FlashSaleReservationItem {
  string flash_sale_item_id = 1;
  string sku_id = 2;
  int32 quantity = 3;
  string shop_id = 4;
}

message ShopDiscountProgramReservationItem {
  string shop_discount_program_item_id = 1;
  string sku_id = 2;
  int32 quantity = 3;
  string shop_id = 4;
}

message CreateVoucherRequest {
  string code = 1;
  string name = 2;
  VoucherScope scope = 3;
  string shop_id = 4;
  DiscountType discount_type = 5;
  int64 value_vnd = 6;
  int32 discount_percent = 7;
  int64 max_discount_vnd = 8;
  int64 min_order_vnd = 9;
  int32 quota = 10;
  int32 per_user_limit = 11;
  int64 budget_vnd = 12;
  google.protobuf.Timestamp starts_at = 13;
  google.protobuf.Timestamp ends_at = 14;
  string created_by = 15;
  repeated string category_ids = 16;
}

message CreateVoucherResponse {
  Voucher voucher = 1;
}

message UpdateVoucherRequest {
  string voucher_id = 1;
  optional string name = 2;
  optional DiscountType discount_type = 3;
  optional int64 value_vnd = 4;
  optional int32 discount_percent = 5;
  optional int64 max_discount_vnd = 6;
  optional int64 min_order_vnd = 7;
  optional int32 quota = 8;
  optional int32 per_user_limit = 9;
  optional int64 budget_vnd = 10;
  google.protobuf.Timestamp starts_at = 11;
  google.protobuf.Timestamp ends_at = 12;
  repeated string category_ids = 13;
  // When true, replaces category_ids with the provided list (including empty to clear restriction).
  bool replace_category_ids = 14;
}

message UpdateVoucherResponse {
  Voucher voucher = 1;
}

message SetVoucherStatusRequest {
  string voucher_id = 1;
  // Valid target values: VOUCHER_STATUS_ACTIVE or VOUCHER_STATUS_PAUSED.
  VoucherStatus status = 2;
}

message SetVoucherStatusResponse {
  Voucher voucher = 1;
}

message DeleteVoucherRequest {
  string voucher_id = 1;
}

message DeleteVoucherResponse {
  bool ok = 1;
}

message ListAvailableVouchersRequest {
  string user_id = 1;
  string shop_id = 2;
  VoucherScope scope = 3;
  int64 order_amount_vnd = 4;
  // For seller/admin management listings (includes PAUSED/scheduled/expired; excludes DELETED unless filtered).
  bool include_inactive = 5;
  VoucherStatus status = 6;
  // Optional sales channel: "" (defaults to "MARKETPLACE"), "MARKETPLACE", or "STOREFRONT".
  string sales_channel = 7;
  // Storefront shop ID when sales_channel is "STOREFRONT".
  string storefront_shop_id = 8;
}

message ListAvailableVouchersResponse {
  repeated Voucher vouchers = 1;
}

message SaveVoucherRequest {
  string user_id = 1;
  string voucher_id = 2;
  string code = 3;
}

message SaveVoucherResponse {
  bool saved = 1;
  Voucher voucher = 2;
}

message CreateFlashSaleRequest {
  string name = 1;
  google.protobuf.Timestamp starts_at = 2;
  google.protobuf.Timestamp ends_at = 3;
  string created_by = 4;
  int32 min_discount_percent = 5;
  repeated string category_ids = 6;
}

message CreateFlashSaleResponse {
  FlashSale flash_sale = 1;
}

message RegisterFlashSaleItemRequest {
  string flash_sale_id = 1;
  string shop_id = 2;
  string sku_id = 3;
  int64 flash_price_vnd = 4;
  int32 total_slots = 5;
  int32 per_user_limit = 6;
}

message RegisterFlashSaleItemResponse {
  FlashSaleItem item = 1;
}

message ApproveFlashSaleItemRequest {
  string admin_id = 1;
  string item_id = 2;
  bool approve = 3;
  string reason = 4;
}

message ApproveFlashSaleItemResponse {
  FlashSaleItem item = 1;
}

message EndFlashSaleWindowRequest {
  string window_id = 1;
}

message EndFlashSaleWindowResponse {
  FlashSale window = 1;
  int32 released_items = 2;
}

message ListActiveFlashSalesRequest {
  bool include_upcoming = 1;
}

message ListActiveFlashSalesResponse {
  repeated FlashSale flash_sales = 1;
}

message ListFlashSaleItemsRequest {
  FlashSaleItemStatus status = 1;
  string flash_sale_id = 2;
  string shop_id = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListFlashSaleItemsResponse {
  repeated FlashSaleItem items = 1;
  int64 total = 2;
}

message ListAllFlashSalesRequest {
  // Optional window status filter: UPCOMING, ACTIVE, ENDED (empty returns all).
  string status = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListAllFlashSalesResponse {
  repeated FlashSale flash_sales = 1;
  int64 total = 2;
}

message CreateShopDiscountProgramRequest {
  string shop_id = 1;
  string name = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
  repeated ShopDiscountProgramItemInput items = 5;
}

message CreateShopDiscountProgramResponse {
  ShopDiscountProgram program = 1;
  repeated string warnings = 2;
}

message UpdateShopDiscountProgramRequest {
  string program_id = 1;
  optional string name = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
  repeated ShopDiscountProgramItemInput items = 5;
  bool replace_items = 6;
}

message UpdateShopDiscountProgramResponse {
  ShopDiscountProgram program = 1;
  repeated string warnings = 2;
}

message EndShopDiscountProgramRequest {
  string program_id = 1;
}

message EndShopDiscountProgramResponse {
  ShopDiscountProgram program = 1;
}

message ListShopDiscountProgramsRequest {
  string shop_id = 1;
  ShopDiscountProgramStatus status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListShopDiscountProgramsResponse {
  repeated ShopDiscountProgram programs = 1;
  int64 total = 2;
}

message ListActiveShopDiscountsRequest {
  repeated string sku_ids = 1;
  string shop_id = 2;
}

message ListActiveShopDiscountsResponse {
  repeated ActiveShopDiscount discounts = 1;
}

message GetCoinBalanceRequest {
  string user_id = 1;
}

message GetCoinBalanceResponse {
  string user_id = 1;
  int64 balance = 2;
  repeated CoinTransaction recent_transactions = 3;
}

message CreditCoinsRequest {
  string user_id = 1;
  int64 amount = 2;
  string reason = 3;
  string reference_id = 4;
}

message CreditCoinsResponse {
  string user_id = 1;
  int64 balance = 2;
  bool already_credited = 3;
}

message PreviewDiscountsRequest {
  string user_id = 1;
  repeated ShopDiscountInput shop_items = 2;
  map<string, string> shop_voucher_ids = 3;
  string platform_voucher_id = 4;
  string freeship_voucher_id = 5;
  int64 coins_to_use = 6;
  // Optional sales channel: "" (defaults to "MARKETPLACE"), "MARKETPLACE", or "STOREFRONT".
  string sales_channel = 7;
  // Required shop ID when sales_channel is "STOREFRONT"; empty for "MARKETPLACE".
  string storefront_shop_id = 8;
}

message PreviewDiscountsResponse {
  DiscountBreakdown breakdown = 1;
}

message ReservePromotionRequest {
  string order_id = 1;
  // Required (D3): caller must authenticate with the order-service token (claims.Service == "order-service"); user_id comes from the request.
  string user_id = 2;
  map<string, string> shop_voucher_ids = 3;
  string platform_voucher_id = 4;
  string freeship_voucher_id = 5;
  int64 coins_to_use = 6;
  repeated FlashSaleReservationItem flash_sale_items = 7;
  repeated ShopDiscountInput shop_items = 8;
  repeated ShopDiscountProgramReservationItem shop_discount_program_items = 9;
  // Optional sales channel: "" (defaults to "MARKETPLACE"), "MARKETPLACE", or "STOREFRONT".
  string sales_channel = 10;
  // Required shop ID when sales_channel is "STOREFRONT"; empty for "MARKETPLACE".
  string storefront_shop_id = 11;
}

message ReservePromotionResponse {
  bool reserved = 1;
  bool already_reserved = 2;
  DiscountBreakdown breakdown = 3;
}

message ReleasePromotionRequest {
  string order_id = 1;
}

message ReleasePromotionResponse {
  bool released = 1;
  bool already_released = 2;
}

// Releases reserved promotions for one shop sub-order within a checkout group.
// order_id is the checkout group ID passed to ReservePromotion; idempotent per (order_id, shop_id).
// sub_order_id (orders.id) is used to look up and claw back order_completed_reward coins (falls back to order_id).
// When clawback_only is true, ONLY reward coins are clawed back without releasing vouchers/coins/flash-sale slots/usage.
message ReleasePromotionShopRequest {
  string order_id = 1;
  string shop_id = 2;
  string reason = 3;
  string sub_order_id = 4;
  bool clawback_only = 5;
}

message ReleasePromotionShopResponse {
  bool released = 1;
  bool already_released = 2;
  int64 coins_returned = 3;
  bool shop_voucher_released = 4;
  int32 flash_sale_quantity_released = 5;
  bool platform_voucher_released = 6;
  int32 shop_program_quantity_released = 7;
}

service PromotionService {
  rpc CreateVoucher(CreateVoucherRequest) returns (CreateVoucherResponse);
  rpc UpdateVoucher(UpdateVoucherRequest) returns (UpdateVoucherResponse);
  rpc SetVoucherStatus(SetVoucherStatusRequest) returns (SetVoucherStatusResponse);
  rpc DeleteVoucher(DeleteVoucherRequest) returns (DeleteVoucherResponse);
  rpc ListAvailableVouchers(ListAvailableVouchersRequest) returns (ListAvailableVouchersResponse);
  rpc SaveVoucher(SaveVoucherRequest) returns (SaveVoucherResponse);
  rpc CreateFlashSale(CreateFlashSaleRequest) returns (CreateFlashSaleResponse);
  rpc RegisterFlashSaleItem(RegisterFlashSaleItemRequest) returns (RegisterFlashSaleItemResponse);
  rpc ApproveFlashSaleItem(ApproveFlashSaleItemRequest) returns (ApproveFlashSaleItemResponse);
  rpc EndFlashSaleWindow(EndFlashSaleWindowRequest) returns (EndFlashSaleWindowResponse);
  rpc ListActiveFlashSales(ListActiveFlashSalesRequest) returns (ListActiveFlashSalesResponse);
  rpc ListFlashSaleItems(ListFlashSaleItemsRequest) returns (ListFlashSaleItemsResponse);
  rpc ListAllFlashSales(ListAllFlashSalesRequest) returns (ListAllFlashSalesResponse);
  rpc CreateShopDiscountProgram(CreateShopDiscountProgramRequest) returns (CreateShopDiscountProgramResponse);
  rpc UpdateShopDiscountProgram(UpdateShopDiscountProgramRequest) returns (UpdateShopDiscountProgramResponse);
  rpc EndShopDiscountProgram(EndShopDiscountProgramRequest) returns (EndShopDiscountProgramResponse);
  rpc ListShopDiscountPrograms(ListShopDiscountProgramsRequest) returns (ListShopDiscountProgramsResponse);
  rpc ListActiveShopDiscounts(ListActiveShopDiscountsRequest) returns (ListActiveShopDiscountsResponse);
  rpc GetCoinBalance(GetCoinBalanceRequest) returns (GetCoinBalanceResponse);
  rpc CreditCoins(CreditCoinsRequest) returns (CreditCoinsResponse);
  rpc PreviewDiscounts(PreviewDiscountsRequest) returns (PreviewDiscountsResponse);
  rpc ReservePromotion(ReservePromotionRequest) returns (ReservePromotionResponse);
  rpc ReleasePromotion(ReleasePromotionRequest) returns (ReleasePromotionResponse);
  rpc ReleasePromotionShop(ReleasePromotionShopRequest) returns (ReleasePromotionShopResponse);
}
