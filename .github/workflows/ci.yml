name: NexusMart Core CI

# Chạy tay để tiết kiệm quota Actions: `gh workflow run ci.yml` hoặc nút Run workflow.
# Gate hằng ngày chạy local: make lint, make test, make e2e.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto-lint:
    name: Protobuf Lint & Generate Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: v1.45.0
      - run: buf lint

  go-lint-and-test:
    name: Go Lint & Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - pkg/common
          - gen/go
          - services/gateway
          - services/user
          - services/product
          - services/cart
          - services/promotion
          - services/order
          - services/shipping
          - services/notification
          - services/search
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"
      - name: Check gofmt
        working-directory: ${{ matrix.module }}
        run: |
          if [ -f go.mod ]; then
            UNFMT=$(gofmt -l .)
            if [ -n "$UNFMT" ]; then
              echo "Unformatted files:"
              echo "$UNFMT"
              exit 1
            fi
          fi
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          working-directory: ${{ matrix.module }}
          args: -c ${{ github.workspace }}/.golangci.yml
      - name: Run Go unit tests
        working-directory: ${{ matrix.module }}
        run: go test -race -cover ./...

  rust-payment:
    name: Rust Payment (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/payment
      - name: cargo fmt
        working-directory: services/payment
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: services/payment
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: services/payment
        run: cargo test

  web:
    name: Web Frontend (lint, format, data, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - name: Data integrity check
        run: npm run check:data
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  go-vuln-scan:
    name: Go Dependency Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.3
      - name: Run govulncheck across all Go modules
        run: |
          set -euo pipefail
          for mod in pkg/common gen/go services/gateway services/user services/product services/cart services/promotion services/order services/shipping services/notification services/search; do
            echo "==> govulncheck $mod"
            (cd "$mod" && govulncheck ./...)
          done

  rust-audit:
    name: Rust Dependency Scan (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: Run cargo audit
        working-directory: services/payment
        run: cargo audit

  web-audit:
    name: Web Dependency Scan (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run npm audit
        run: npm audit --omit=dev --audit-level=high

  docker-build:
    name: Docker Build & Image Scan (${{ matrix.target.service }})
    runs-on: ubuntu-latest
    needs: [proto-lint, go-lint-and-test, rust-payment, web]
    strategy:
      fail-fast: false
      matrix:
        target:
          - service: gateway
            dockerfile: services/gateway/Dockerfile
          - service: user
            dockerfile: services/user/Dockerfile
          - service: product
            dockerfile: services/product/Dockerfile
          - service: cart
            dockerfile: services/cart/Dockerfile
          - service: promotion
            dockerfile: services/promotion/Dockerfile
          - service: order
            dockerfile: services/order/Dockerfile
          - service: payment
            dockerfile: services/payment/Dockerfile
          - service: shipping
            dockerfile: services/shipping/Dockerfile
          - service: notification
            dockerfile: services/notification/Dockerfile
          - service: search
            dockerfile: services/search/Dockerfile
          - service: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          push: false
          load: true
          tags: nexusmart/${{ matrix.target.service }}:ci
      - name: Scan ${{ matrix.target.service }} image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: nexusmart/${{ matrix.target.service }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
